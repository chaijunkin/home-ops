---
name: Image Pull

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: "0.6.5"

jobs:
  extract:
    name: Image Pull - Extract Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
          install: false

      - name: Extract Images
        id: extract
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo 'images<<EOF' >> $GITHUB_OUTPUT
          mise exec "github:home-operations/flate@${FLATE_VERSION}" -- flate diff images -p ./kubernetes/apps -o json >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  pull:
    if: >-
      ${{
        needs.extract.outputs.images != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: extract
    name: Image Pull - Pull Images
    runs-on: home-ops-runner
    permissions:
      contents: read
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    env:
      MATRIX_IMAGE: ${{ matrix.image }}
    steps:
      - name: Setup talosctl
        run: |
          if ! command -v talosctl >/dev/null 2>&1; then
            ARCH=$(uname -m)
            case "$ARCH" in
              x86_64) TALOS_ARCH="amd64" ;;
              aarch64|arm64) TALOS_ARCH="arm64" ;;
              *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
            esac
            # renovate: datasource=github-releases depName=siderolabs/talos
            TALOS_VERSION="v1.13.0"
            mkdir -p "$HOME/.local/bin"
            curl -fsSL "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/talosctl-linux-${TALOS_ARCH}" -o "$HOME/.local/bin/talosctl"
            chmod +x "$HOME/.local/bin/talosctl"
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi
          talosctl version --client

      - name: Pull Image
        run: talosctl --nodes $NODE image pull "${MATRIX_IMAGE}"

  success:
    if: ${{ !cancelled() }}
    needs: [extract, pull]
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
