---
- name: Test AI Inference Stack, Metrics & Observability
  hosts: localhost
  gather_facts: false
  vars:
    strix_host: "{{ lookup('env', 'STRIX_HOST') | default('192.168.1.149', true) }}"
    gufo_port: "{{ lookup('env', 'GUFO_PORT') | default('8732', true) }}"
    embeddings_port: "{{ lookup('env', 'EMBEDDINGS_PORT') | default('8743', true) }}"
    reranker_port: "{{ lookup('env', 'RERANKER_PORT') | default('8744', true) }}"
    litellm_url: "{{ lookup('env', 'LITELLM_URL') | default('https://litellm.cloudjur.com', true) }}"
    prometheus_url: "{{ lookup('env', 'PROMETHEUS_URL') | default('https://prometheus.cloudjur.com', true) }}"
    test_model: "{{ lookup('env', 'TEST_MODEL') | default('local-pool-chat', true) }}"
    min_tokens_per_sec: 35.0

  tasks:
    - name: 1.1 Verify Qwen3.8 Flash Next health endpoint
      ansible.builtin.command: >-
        curl -sSf -m 5 "http://{{ strix_host }}:{{ gufo_port }}/health"
      register: r_health_llm
      changed_when: false

    - name: 1.2 Verify Memini Embeddings health endpoint
      ansible.builtin.command: >-
        curl -sSf -m 5 "http://{{ strix_host }}:{{ embeddings_port }}/health"
      register: r_health_emb
      changed_when: false

    - name: 1.3 Verify Memini Reranker health endpoint
      ansible.builtin.command: >-
        curl -sSf -m 5 "http://{{ strix_host }}:{{ reranker_port }}/health"
      register: r_health_rerank
      changed_when: false

    - name: 2.1 Scrape raw Gufo metrics from bare-metal node
      ansible.builtin.command: >-
        curl -sSf -m 5 "http://{{ strix_host }}:{{ gufo_port }}/metrics"
      register: r_gufo_metrics
      changed_when: false

    - name: 2.2 Parse critical runtime metrics
      ansible.builtin.set_fact:
        tg_speed: "{{ r_gufo_metrics.stdout | regex_search('llamacpp:predicted_tokens_seconds\\s+([0-9.]+)', '\\1') | first | default('0', true) | float }}"
        pp_speed: "{{ r_gufo_metrics.stdout | regex_search('llamacpp:prompt_tokens_seconds\\s+([0-9.]+)', '\\1') | first | default('0', true) | float }}"
        draft_tokens: "{{ r_gufo_metrics.stdout | regex_search('llamacpp:spec_decode_num_draft_tokens_total\\s+([0-9]+)', '\\1') | first | default('0', true) | int }}"
        accepted_tokens: "{{ r_gufo_metrics.stdout | regex_search('llamacpp:spec_decode_num_accepted_tokens_total\\s+([0-9]+)', '\\1') | first | default('0', true) | int }}"
        cached_tokens: "{{ r_gufo_metrics.stdout | regex_search('llamacpp:prompt_tokens_cached_total\\s+([0-9]+)', '\\1') | first | default('0', true) | int }}"
        device_lost: "{{ r_gufo_metrics.stdout | regex_search('gufo_device_lost_total\\s+([0-9]+)', '\\1') | first | default('0', true) | int }}"

    - name: 2.3 Assert zero GPU device drops and valid metrics
      ansible.builtin.assert:
        that:
          - device_lost == 0
          - tg_speed > 0
          - pp_speed > 0
          - draft_tokens > 0
        fail_msg: "Gufo metrics validation failed! device_lost={{ device_lost }}, tg_speed={{ tg_speed }}"
        success_msg: "Bare-metal metrics healthy: TG={{ tg_speed }} tok/s, PP={{ pp_speed }} tok/s, Accepted MTP={{ accepted_tokens }}/{{ draft_tokens }}"

    - name: 3.1 Fetch LiteLLM Master Key from environment or Kubernetes
      ansible.builtin.shell: |
        if [ -n "${LITELLM_MASTER_KEY:-}" ]; then
          echo "$LITELLM_MASTER_KEY"
        else
          kubectl get secret -n ai litellm -o jsonpath='{.data.LITELLM_MASTER_KEY}' 2>/dev/null | base64 -d
        fi
      register: r_litellm_key
      changed_when: false

    - name: 3.2 Execute live end-to-end chat completion via LiteLLM
      ansible.builtin.command: >-
        curl -sSf -k -m 20 "{{ litellm_url }}/v1/chat/completions"
        -H "Content-Type: application/json"
        -H "Authorization: Bearer {{ r_litellm_key.stdout }}"
        -d '{"model":"{{ test_model }}","messages":[{"role":"user","content":"Count from 1 to 20 with commas."}],"max_tokens":35}'
      register: r_chat_raw
      changed_when: false

    - name: 3.3 Parse live chat completion response
      ansible.builtin.set_fact:
        chat_resp: "{{ r_chat_raw.stdout | from_json }}"

    - name: 3.4 Extract and assert live inference performance
      vars:
        live_tg_speed: "{{ chat_resp.usage.completion_tokens_per_second | default(0.0) | float }}"
        live_draft_accepted: "{{ chat_resp.usage.draft_tokens_accepted | default(0) | int }}"
        live_draft_total: "{{ chat_resp.usage.draft_tokens | default(0) | int }}"
      ansible.builtin.assert:
        that:
          - live_tg_speed >= min_tokens_per_sec
          - live_draft_accepted > 0
        fail_msg: "Inference speed under threshold! Speed={{ live_tg_speed }} tok/s (required >={{ min_tokens_per_sec }}), accepted={{ live_draft_accepted }}/{{ live_draft_total }}"
        success_msg: "Live completion OK: {{ live_tg_speed }} tok/s, speculative accepted: {{ live_draft_accepted }}/{{ live_draft_total }}"

    - name: 4.1 Query Prometheus for Strix Halo Blackbox probe statuses
      ansible.builtin.command: >-
        curl -sSf -k -m 10 "{{ prometheus_url }}/api/v1/query?query=probe_success%7Binstance%3D~%27.*192.168.1.149.*%27%7D"
      register: r_prom_blackbox_raw
      changed_when: false

    - name: 4.2 Assert all Blackbox probes are UP (status = 1)
      vars:
        prom_blackbox: "{{ r_prom_blackbox_raw.stdout | from_json }}"
        probe_statuses: "{{ prom_blackbox.data.result | map(attribute='value') | map('last') | list }}"
      ansible.builtin.assert:
        that:
          - probe_statuses | length >= 4
          - "'0' not in probe_statuses"
        fail_msg: "One or more Blackbox probes for Strix Halo are failing! Results: {{ prom_blackbox.data.result }}"
        success_msg: "All {{ probe_statuses | length }} Blackbox probes reporting 1 (UP)"

    - name: 4.3 Query Prometheus for active AI Observability alerts
      ansible.builtin.command: >-
        curl -sSf -k -m 10 "{{ prometheus_url }}/api/v1/query?query=ALERTS%7Balertname%3D~%27AIObservability.*%27%2Calertstate%3D%27firing%27%7D"
      register: r_prom_alerts_raw
      changed_when: false

    - name: 4.4 Assert zero firing AI Observability alerts
      vars:
        prom_alerts: "{{ r_prom_alerts_raw.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - prom_alerts.data.result | length == 0
        fail_msg: "Active firing AI alerts detected: {{ prom_alerts.data.result }}"
        success_msg: "Zero firing AI alerts in Prometheus"

    - name: 5. Display Comprehensive AI Stack Test Report
      vars:
        prom_blackbox: "{{ r_prom_blackbox_raw.stdout | from_json }}"
        live_tg_speed: "{{ chat_resp.usage.completion_tokens_per_second | default(0.0) | round(2) }}"
        live_pp_speed: "{{ (chat_resp.usage.prompt_tokens_per_second | default(0.0) | float) if (chat_resp.usage.prompt_tokens_per_second | default(0.0) | float > 0) else pp_speed | round(2) }}"
        live_draft_accepted: "{{ chat_resp.usage.draft_tokens_accepted | default(0) }}"
        live_draft_total: "{{ chat_resp.usage.draft_tokens | default(0) }}"
        acceptance_pct: "{{ ((live_draft_accepted | float / (live_draft_total if live_draft_total > 0 else 1)) * 100) | round(1) }}"
      ansible.builtin.debug:
        msg: |
          =======================================================
                        AI STACK METRICS & HEALTH REPORT
          =======================================================
          [PASS] Qwen3.8 Flash Next (:{{ gufo_port }}/health)     : 200 OK
          [PASS] Memini Embeddings (:{{ embeddings_port }}/health)  : 200 OK
          [PASS] Memini Reranker (:{{ reranker_port }}/health)    : 200 OK
          -------------------------------------------------------
          [PASS] Generation Throughput (Live) : {{ live_tg_speed }} tok/s (Target: >= {{ min_tokens_per_sec }} tok/s)
          [PASS] Prompt Processing Speed      : {{ live_pp_speed }} tok/s
          [PASS] Speculative Decoding MTP     : {{ live_draft_accepted }}/{{ live_draft_total }} tokens ({{ acceptance_pct }}% accepted)
          [PASS] Persistent Prompt Cache Hits : {{ cached_tokens }} tokens cached
          [PASS] Hardware GPU Health          : 0 device drops
          -------------------------------------------------------
          [PASS] Blackbox Exporter Probes     : {{ prom_blackbox.data.result | length }} active / 0 failing
          [PASS] Prometheus AI Alerts         : 0 firing
          =======================================================
          Status: ALL SYSTEMS NOMINAL AND RUNNING AT PEAK SPEED
          =======================================================
