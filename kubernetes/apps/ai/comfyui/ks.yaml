# yaml-language-server: $schema=https://crd.cloudjur.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: comfyui
  namespace: flux-system
spec:
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: comfyui
  path: ./kubernetes/apps/ai/comfyui/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  components:
    - ../../../../components/kopiur/backup
      # - ../../../../components/kopiur/remote
      # - ../../../../components/kopiur/adhoc-snapshot
      # - ../../../../components/volsync
  postBuild:
    substitute:
      APP: comfyui
      KOPIUR_CAPACITY: 20Gi
      # KOPIUR_PUID: "0"
      # KOPIUR_PGID: "0"
      # KOPIUR_NONROOT: "false"
