# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  config.yaml: |
    model:
      default: kimi-k2.6
      provider: litellm
    fallback_providers:
      - provider: litellm
        model: self-hosted
      - provider: litellm
        model: qwen3.6-plus
      - provider: litellm
        model: glm-5.1
    providers:
      litellm:
        base_url: http://litellm.ai:4000/v1
        key_env: LITELLM_API_KEY
      litellm-anthropic:
        base_url: http://litellm.ai:4000/
        api_mode: anthropic_message
        key_env: LITELLM_API_KEY
    toolsets:
      - hermes-cli
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 180
      persistent_shell: true
    memory:
      provider: memini
      auto_migrate: true
    compression:
      enabled: true
      threshold: 0.50
      target_ratio: 0.20
      protect_last_n: 20
    agent:
      max_turns: 90
      gateway_timeout: 1800
      restart_drain_timeout: 60
      api_max_retries: 2
      reasoning_effort: medium
    streaming:
      enabled: false
    security:
      redact_secrets: true
    privacy:
      redact_pii: true
    platform_toolsets:
      cli:
        - hermes-cli
      telegram:
        - hermes-telegram
    mcp_servers:
      toolhive:
        url: http://vmcp-mcp-gateway-internal.ai:4483/mcp
    auxiliary:
      vision:
        provider: litellm
        model: gemini-2.5-flash
      compression:
        provider: litellm
        model: gemini-2.5-flash
        timeout: 180
      web_extract:
        provider: litellm
        model: gemini-2.5-flash
        timeout: 120
      approval:
        provider: litellm
        model: gemini-2.5-flash
        timeout: 60
      session_search:
        provider: litellm
        model: self-hosted
        timeout: 120
    discord:
      require_mention: true
      thread_require_mention: false
      auto_thread: true
      reactions: true
      ignored_channels: []
      no_thread_channels: []
      history_backfill: false
      history_backfill_limit: 50
      channel_prompts: {}
      allow_mentions:
        everyone: false
        roles: false
        users: true
        replied_user: true
  env: |-
    LITELLM_API_KEY={{ .LITELLM_API_KEY }}
    OPENAI_API_KEY={{ .LITELLM_API_KEY }}
    OPENAI_BASE_URL=http://litellm.ai:4000/v1
    SUMMARY_LLM_API_KEY={{ .LITELLM_API_KEY }}
    API_SERVER_KEY={{ .API_SERVER_KEY }}
    COMPOSIO_API_KEY: {{ .COMPOSIO_API_KEY }}
    DISCORD_ALLOWED_USERS: {{ .DISCORD_ALLOWED_USERS }}
    DISCORD_BOT_TOKEN: {{ .DISCORD_BOT_TOKEN }}
    DISCORD_HOME_CHANNEL: {{ .DISCORD_HOME_CHANNEL }}
    DISCORD_FREE_RESPONSE_CHANNELS: {{ .DISCORD_FREE_RESPONSE_CHANNELS }}
    MEMINI_API_KEY: {{ .MEMINI_API_KEY }}
