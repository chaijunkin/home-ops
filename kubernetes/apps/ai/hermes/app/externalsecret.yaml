# yaml-language-server: $schema=https://crd.cloudjur.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: hermes
    template:
      data:
        COMPOSIO_API_KEY: "{{ .COMPOSIO_API_KEY }}"
        DISCORD_ALLOWED_USERS: "{{ .DISCORD_ALLOWED_USERS }}"
        DISCORD_BOT_TOKEN: "{{ .DISCORD_BOT_TOKEN }}"
        DISCORD_HOME_CHANNEL: "{{ .DISCORD_HOME_CHANNEL }}"
        # GITHUB_PERSONAL_ACCESS_TOKEN: "{{ .GITHUB_TOKEN }}"
        LITELLM_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        # TELEGRAM_HOME_CHANNEL: "{{ .TELEGRAM_ALLOWED_USERS }}"
        # TELEGRAM_ALLOWED_USERS: "{{ .TELEGRAM_ALLOWED_USERS }}"
        # TELEGRAM_BOT_TOKEN: "{{ .TELEGRAM_BOT_TOKEN }}"
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
  data:
    - secretKey: COMPOSIO_API_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: bb3859cf-4952-42db-9a7b-fdf2e3c12e7f
        property: COMPOSIO_API_KEY
    - secretKey: DISCORD_ALLOWED_USERS
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 5b7654bd-3e40-458f-a354-7dd17aab0496
        property: DISCORD_ALLOWED_USERS
    - secretKey: DISCORD_BOT_TOKEN
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 5b7654bd-3e40-458f-a354-7dd17aab0496
        property: DISCORD_BOT_TOKEN
    - secretKey: DISCORD_HOME_CHANNEL
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 5b7654bd-3e40-458f-a354-7dd17aab0496
        property: DISCORD_HOME_CHANNEL
    # - secretKey: GITHUB_TOKEN
    #   sourceRef:
    #     storeRef:
    #       name: bitwarden-fields
    #       kind: ClusterSecretStore
    #   remoteRef:
    #     key: 5b7654bd-3e40-458f-a354-7dd17aab0496
    #     property: GITHUB_TOKEN
    - secretKey: LITELLM_MASTER_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: bf2fcc14-bd51-4122-9445-53dacdfb1d69
        property: LITELLM_MASTER_KEY
    # - secretKey: TELEGRAM_ALLOWED_USERS
    #   sourceRef:
    #     storeRef:
    #       name: bitwarden-fields
    #       kind: ClusterSecretStore
    #   remoteRef:
    #     key: 5b7654bd-3e40-458f-a354-7dd17aab0496
    #     property: TELEGRAM_ALLOWED_USERS
    # - secretKey: TELEGRAM_BOT_TOKEN
    #   sourceRef:
    #     storeRef:
    #       name: bitwarden-fields
    #       kind: ClusterSecretStore
    #   remoteRef:
    #     key: 5b7654bd-3e40-458f-a354-7dd17aab0496
    #     property: TELEGRAM_BOT_TOKEN
    - secretKey: MEMINI_API_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 5b8f5c59-8a9c-495b-9f40-9ea2a2ab249f
        property: api_key
