# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      hostAliases:
        - ip: 10.10.30.26
          hostnames:
            - auth.cloudjur.com
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                cp /tmp/config.yaml /opt/data/config.yaml
                cp /tmp/env /opt/data/.env
                chown 10000:10000 /opt/data/.env
                chown 10000:10000 /opt/data/config.yaml
                mkdir -p /opt/data/.ssh
                if [ -f /tmp/ssh/id_ed25519 ]; then
                  cp /tmp/ssh/id_ed25519 /opt/data/.ssh/id_ed25519
                  chmod 600 /opt/data/.ssh/id_ed25519
                fi
                if [ -f /tmp/ssh/id_ed25519.pub ]; then
                  cp /tmp/ssh/id_ed25519.pub /opt/data/.ssh/id_ed25519.pub
                  chmod 644 /opt/data/.ssh/id_ed25519.pub
                fi
                if [ -f /tmp/ssh_config ]; then
                  cp /tmp/ssh_config /opt/data/.ssh/config
                  chmod 600 /opt/data/.ssh/config
                fi
                chmod 700 /opt/data/.ssh
                chown -R 10000:10000 /opt/data/.ssh
                # Install the memini memory-provider plugin from the upstream
                # standalone mirror eleboucher/memini-hermes (a release-synced
                # copy of integrations/hermes/plugin/memini — the blessed
                # owner/repo form). Pinned to a commit, guarded by a .ref
                # marker so normal restarts stay offline and it only refetches
                # when the pin changes. The mirror is untagged, so bump this
                # SHA by hand (revisit once eleboucher/memini cuts a tagged
                # release carrying the handle_tool_call **kwargs fix, then
                # renovate github-tags can track it again).
                MEMINI_PLUGIN_REF=c36842f6e2fa4a5e89f689d78d6d2daa2bf73219
                PLUGIN_DIR=/opt/data/plugins/memini
                if [ "$(cat "$PLUGIN_DIR/.ref" 2>/dev/null)" != "$MEMINI_PLUGIN_REF" ]; then
                  BASE="https://raw.githubusercontent.com/eleboucher/memini-hermes/$MEMINI_PLUGIN_REF"
                  if wget -qO /tmp/memini-init.py "$BASE/__init__.py" && wget -qO /tmp/memini-plugin.yaml "$BASE/plugin.yaml"; then
                    rm -rf "$PLUGIN_DIR"
                    mkdir -p "$PLUGIN_DIR"
                    mv /tmp/memini-init.py "$PLUGIN_DIR/__init__.py"
                    mv /tmp/memini-plugin.yaml "$PLUGIN_DIR/plugin.yaml"
                    printf '%s' "$MEMINI_PLUGIN_REF" > "$PLUGIN_DIR/.ref"
                    chown -R 10000:10000 "$PLUGIN_DIR"
                  else
                    echo "WARN: memini plugin fetch failed; starting with whatever is present"
                  fi
                fi
        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.8.19@sha256:3811ed13da874fba2ac99b6d492db9a203d34cb6dccf90d886948c00d0ccec09
            args: [gateway, run]
            env:
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes.cloudjur.com
              HERMES_DASHBOARD_OIDC_SCOPES: "openid profile email offline_access"
              MEMINI_URL: http://memini.ai:8080
              MEMINI_NAMESPACE: hermes
              HERMES_HOME: /opt/data
              HOME: /opt/data
              GIT_SSH_COMMAND: "ssh -F /opt/data/.ssh/config"
              OBSIDIAN_VAULT_PATH: /mnt/defaultvault
              HERMES_ENV: "prod"
              FLIGHT_DISCORD_ENV: "dev"
              TZ: Asia/Kuala_Lumpur
            envFrom:
              - secretRef:
                  name: hermes
              - secretRef:
                  name: hermes-dashboard
            resources:
              requests:
                cpu: 500m
                memory: 32Mi
              limits:
                memory: 4Gi
            ports:
              - containerPort: &port 8642
                name: http
                protocol: TCP
              - containerPort: &dashboard_port 9119
                name: dashboard
                protocol: TCP
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.133.0@sha256:e073a441c61c85821a7f16b64cf93b4e77b4092899bb1f3bed906fbd558afd62
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
              runAsNonRoot: true
            env:
              HOME: /opt/data
              GIT_SSH_COMMAND: "ssh -F /opt/data/.ssh/config"
              OBSIDIAN_VAULT_PATH: /mnt/defaultvault
              TZ: Asia/Kuala_Lumpur
            args:
              [
                --auth,
                none,
                --user-data-dir,
                /opt/data/.vscode,
                --extensions-dir,
                /opt/data/.vscode,
                --port,
                "12321",
                /opt/data,
              ]
            ports:
              - containerPort: &codeserverPort 12321
                name: codeserver
                protocol: TCP
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        controller: hermes
        ports:
          http:
            port: *port
          dashboard:
            port: *dashboard_port
          codeserver:
            port: *codeserverPort
    route:
      app:
        hostnames: [hermes.cloudjur.com]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
      codeserver:
        hostnames: [hermes-code.cloudjur.com]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: codeserver
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      configmap:
        type: configMap
        name: "{{ .Release.Name }}-config"
        defaultMode: 0755
        advancedMounts:
          hermes:
            init:
              - path: /tmp/config.yaml
                subPath: config.yaml
              - path: /tmp/ssh_config
                subPath: ssh_config
            app:
              - path: /root/.ssh/config
                subPath: ssh_config
      env:
        type: secret
        name: hermes
        defaultMode: 0o400
        advancedMounts:
          hermes:
            init:
              - path: /tmp/env
                subPath: env
      ssh:
        type: secret
        name: hermes-ssh
        defaultMode: 0o400
        advancedMounts:
          hermes:
            init:
              - path: /tmp/ssh
            app:
              - path: /root/.ssh/id_ed25519
                subPath: id_ed25519
              - path: /root/.ssh/id_ed25519.pub
                subPath: id_ed25519.pub
      gallery:
        type: nfs
        server: smb.cloudjur.com
        path: /tank/Apps/comfyui/output
        globalMounts:
          - path: /mnt/gallery
      default-vault:
        type: nfs
        server: smb.cloudjur.com
        path: /tank/Apps/Obsidian/DefaultVault
        globalMounts:
          - path: /mnt/defaultvault
