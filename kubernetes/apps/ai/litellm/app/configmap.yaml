# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-configmap
data:
  config.yaml: |
    model_list:
      # - model_name: self-hosted
      #   model_info:
      #     mode: chat
      #     input_cost_per_token: 0.0000001250
      #     cache_creation_input_token_cost: 0.0000001250
      #     cache_read_input_token_cost: 0.0000000125
      #     output_cost_per_token: 0.0000004999
      #     max_input_tokens: 262144
      #     max_output_tokens: 16384
      #     supports_function_calling: true
      #     supports_vision: false
      #   litellm_params:
      #     model: openai/self-hosted
      #     api_base: http://llama-strix.llm:8080/v1
      #     api_key: llama-strix
      #     max_parallel_requests: 3
      #     order: 1

      - model_name: self-hosted
        model_info:
          mode: chat
          max_input_tokens: 262144
          max_output_tokens: 16384
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          model: openai/qwen/qwen3-4b-thinking-2507
          api_base: http://jk-mac-mini.cloudjur.com:1234/v1
          api_key: lm-studio
          max_parallel_requests: 2
          order: 2

      # ── Cloud Providers ───────────────────────────────────────────────────

      # 0. Google Gemini (OpenAI-compat endpoint)
      - model_name: gemini-2.5-pro
        model_info:
          mode: chat
          input_cost_per_token: 0.0000012500
          cache_read_input_token_cost: 0.0000003125
          output_cost_per_token: 0.0000100000
          max_input_tokens: 1048576
          max_output_tokens: 65536
          supports_function_calling: true
          supports_vision: true
          supports_prompt_caching: true
        litellm_params:
          model: openai/gemini-2.5-pro
          api_base: https://generativelanguage.googleapis.com/v1beta/openai
          api_key: os.environ/GEMINI_API_KEY

      - model_name: gemini-2.5-flash
        model_info:
          mode: chat
          input_cost_per_token: 0.0000003000
          cache_read_input_token_cost: 0.0000000750
          output_cost_per_token: 0.0000025000
          max_input_tokens: 1048576
          max_output_tokens: 65536
          supports_function_calling: true
          supports_vision: true
          supports_prompt_caching: true
        litellm_params:
          model: openai/gemini-2.5-flash
          api_base: https://generativelanguage.googleapis.com/v1beta/openai
          api_key: os.environ/GEMINI_API_KEY

      # 1. OpenRouter (aggregator — model name is passed through as-is)
      - model_name: openrouter/auto
        model_info:
          mode: chat
          max_input_tokens: 200000
          max_output_tokens: 32768
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          model: openai/openrouter/auto
          api_base: https://openrouter.ai/api/v1
          api_key: os.environ/OPENROUTER_API_KEY

      # 2. Cerebras (ultra-low-latency inference)
      - model_name: cerebras/llama-4-scout
        model_info:
          mode: chat
          input_cost_per_token: 0.0000001000
          output_cost_per_token: 0.0000001000
          max_input_tokens: 131072
          max_output_tokens: 8192
          supports_function_calling: true
          supports_vision: false
        litellm_params:
          model: openai/llama-4-scout-17b-16e-instruct
          api_base: https://api.cerebras.ai/v1
          api_key: os.environ/CEREBRAS_API_KEY

      - model_name: cerebras/qwen3-32b
        model_info:
          mode: chat
          input_cost_per_token: 0.0000004000
          output_cost_per_token: 0.0000004000
          max_input_tokens: 131072
          max_output_tokens: 8192
          supports_function_calling: true
          supports_vision: false
        litellm_params:
          model: openai/qwen-3-32b
          api_base: https://api.cerebras.ai/v1
          api_key: os.environ/CEREBRAS_API_KEY

      # 3. HuggingFace Inference Router
      - model_name: hf/qwen3-32b
        model_info:
          mode: chat
          max_input_tokens: 40960
          max_output_tokens: 8192
          supports_function_calling: true
          supports_vision: false
        litellm_params:
          model: openai/Qwen/Qwen3-32B
          api_base: https://router.huggingface.co/v1
          api_key: os.environ/HF_TOKEN

      # 4. Groq (fast inference)
      - model_name: groq/llama-4-scout
        model_info:
          mode: chat
          input_cost_per_token: 0.0000001100
          output_cost_per_token: 0.0000003400
          max_input_tokens: 131072
          max_output_tokens: 8192
          supports_function_calling: true
          supports_vision: false
        litellm_params:
          model: openai/meta-llama/llama-4-scout-17b-16e-instruct
          api_base: https://api.groq.com/openai/v1
          api_key: os.environ/GROQ_API_KEY

      - model_name: groq/kimi-k2
        model_info:
          mode: chat
          input_cost_per_token: 0.0000010000
          output_cost_per_token: 0.0000010000
          max_input_tokens: 131072
          max_output_tokens: 16384
          supports_function_calling: true
          supports_vision: false
        litellm_params:
          model: openai/moonshotai/kimi-k2-instruct
          api_base: https://api.groq.com/openai/v1
          api_key: os.environ/GROQ_API_KEY

      # 5. Mistral AI
      - model_name: mistral-large
        model_info:
          mode: chat
          input_cost_per_token: 0.0000020000
          output_cost_per_token: 0.0000060000
          max_input_tokens: 131072
          max_output_tokens: 16384
          supports_function_calling: true
          supports_vision: false
        litellm_params:
          model: mistral/mistral-large-latest
          api_key: os.environ/MISTRAL_API_KEY

      - model_name: codestral
        model_info:
          mode: chat
          input_cost_per_token: 0.0000003000
          output_cost_per_token: 0.0000009000
          max_input_tokens: 262144
          max_output_tokens: 65536
          supports_function_calling: true
          supports_vision: false
        litellm_params:
          model: mistral/codestral-latest
          api_key: os.environ/MISTRAL_API_KEY

      # 6. Vercel AI Gateway (multi-provider aggregator)
      - model_name: vercel/claude-sonnet
        model_info:
          mode: chat
          max_input_tokens: 200000
          max_output_tokens: 32000
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          model: openai/anthropic/claude-sonnet-4-5
          api_base: https://ai-gateway.vercel.sh/v1
          api_key: os.environ/VERCEL_API_KEY

      # 7. Ilmu AI
      - model_name: ilmu/default
        model_info:
          mode: chat
          max_input_tokens: 131072
          max_output_tokens: 16384
          supports_function_calling: true
          supports_vision: false
        litellm_params:
          model: openai/default
          api_base: https://api.ilmu.ai/v1
          api_key: os.environ/ILMU_API_KEY

      # 8. Local LM Studio (jk-mac-mini) — already active as `self-hosted` above

      # 9. OVH AI Endpoints (Kepler)
      - model_name: ovh/llama-4-scout
        model_info:
          mode: chat
          max_input_tokens: 131072
          max_output_tokens: 8192
          supports_function_calling: true
          supports_vision: false
        litellm_params:
          model: openai/meta-llama/Llama-4-Scout-17B-16E-Instruct
          api_base: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
          # api_key: os.environ/OVH_API_KEY

      # 10. NVIDIA NIM
      - model_name: nvidia/llama-4-scout
        model_info:
          mode: chat
          input_cost_per_token: 0.0000002162
          output_cost_per_token: 0.0000008649
          max_input_tokens: 131072
          max_output_tokens: 16384
          supports_function_calling: true
          supports_vision: false
        litellm_params:
          model: openai/meta/llama-4-scout-17b-16e-instruct
          api_base: https://integrate.api.nvidia.com/v1
          api_key: os.environ/NVIDIA_API_KEY

      - model_name: nvidia/qwen3-235b
        model_info:
          mode: chat
          input_cost_per_token: 0.0000010000
          output_cost_per_token: 0.0000004000
          max_input_tokens: 131072
          max_output_tokens: 32768
          supports_function_calling: true
          supports_vision: false
        litellm_params:
          model: openai/qwen/qwen3-235b-a22b
          api_base: https://integrate.api.nvidia.com/v1
          api_key: os.environ/NVIDIA_API_KEY

      # ── Local / Self-Hosted (archived) ────────────────────────────────────

      # - model_name: ryzen
      #   model_info:
      #     mode: chat
      #     max_input_tokens: 8192
      #     max_output_tokens: 2048
      #     supports_function_calling: true
      #     supports_vision: true
      #   litellm_params:
      #     model: openai/ryzen
      #     api_base: http://10.69.10.120:8080/v1
      #     api_key: llama-ryzen
      #     max_parallel_requests: 1

      # - model_name: vision
      #   model_info:
      #     mode: chat
      #     max_input_tokens: 262144
      #     max_output_tokens: 16384
      #     supports_function_calling: true
      #     supports_vision: true
      #   litellm_params:
      #     model: openai/vision
      #     api_base: http://llama-vision:8080/v1
      #     api_key: llama-vision
      #     max_parallel_requests: 2

      # - model_name: nvidia
      #   model_info:
      #     mode: chat
      #     input_cost_per_token: 0.0000002162
      #     cache_creation_input_token_cost: 0.0000002162
      #     cache_read_input_token_cost: 0.0000000216
      #     output_cost_per_token: 0.0000008649
      #     max_input_tokens: 131072
      #     max_output_tokens: 16384
      #     supports_function_calling: true
      #     supports_vision: false
      #   litellm_params:
      #     model: openai/nvidia
      #     api_base: http://llama-nvidia.llm:8080/v1
      #     api_key: llama-nvidia
      #     max_parallel_requests: 1

      # - model_name: qwen3-embedding-0-6b
      #   model_info:
      #     mode: embedding
      #   litellm_params:
      #     model: openai/qwen3-embedding-0-6b
      #     api_base: http://llama-embed.llm:8080/v1
      #     api_key: qwen3-embedding-0-6b

      # # Qwen3.5-4B (reasoning disabled) on the Intel iGPU — non-reasoning grunt
      # # model for lossless-claw summaries/expansion (replaces self-hosted, whose
      # # reasoning returned empty content). Single slot, 32k ctx.
      # - model_name: summary
      #   model_info:
      #     mode: chat
      #     max_input_tokens: 32768
      #     max_output_tokens: 8192
      #     supports_function_calling: false
      #     supports_vision: false
      #   litellm_params:
      #     model: openai/qwen3.5-4b
      #     api_base: http://llama-summary.llm:8080/v1
      #     api_key: qwen3.5-4b
      #     max_parallel_requests: 1

      # ── Pool Routers (built using active endpoints) ───────────────────────

      # Reasoning pool — high capability reasoning models across active endpoints
      - model_name: reasoning-pool
        model_info:
          mode: chat
          max_input_tokens: 1048576
          max_output_tokens: 65536
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          model: openai/gemini-2.5-pro
          api_base: https://generativelanguage.googleapis.com/v1beta/openai
          api_key: os.environ/GEMINI_API_KEY
          order: 1

      - model_name: reasoning-pool
        model_info:
          mode: chat
          max_input_tokens: 131072
          max_output_tokens: 32768
          supports_function_calling: true
        litellm_params:
          model: openai/qwen/qwen3-235b-a22b
          api_base: https://integrate.api.nvidia.com/v1
          api_key: os.environ/NVIDIA_API_KEY
          order: 2

      - model_name: reasoning-pool
        model_info:
          mode: chat
          max_input_tokens: 40960
          max_output_tokens: 8192
          supports_function_calling: true
        litellm_params:
          model: openai/Qwen/Qwen3-32B
          api_base: https://router.huggingface.co/v1
          api_key: os.environ/HF_TOKEN
          order: 3

      # Frontier pool — smartest available model fallbacks
      - model_name: frontier-pool
        model_info:
          mode: chat
          max_input_tokens: 1048576
          max_output_tokens: 65536
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          model: openai/gemini-2.5-pro
          api_base: https://generativelanguage.googleapis.com/v1beta/openai
          api_key: os.environ/GEMINI_API_KEY
          order: 1

      - model_name: frontier-pool
        model_info:
          mode: chat
          max_input_tokens: 200000
          max_output_tokens: 32768
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          model: openai/openrouter/auto
          api_base: https://openrouter.ai/api/v1
          api_key: os.environ/OPENROUTER_API_KEY
          order: 2

      - model_name: frontier-pool
        model_info:
          mode: chat
          max_input_tokens: 131072
          max_output_tokens: 16384
          supports_function_calling: true
        litellm_params:
          model: openai/default
          api_base: https://api.ilmu.ai/v1
          api_key: os.environ/ILMU_API_KEY
          order: 3

      # Auto complexity router mapping tiers to active endpoint models
      - model_name: auto
        litellm_params:
          model: auto_router/complexity_router
          complexity_router_default_model: gemini-2.5-flash
          complexity_router_config:
            tiers:
              SIMPLE: self-hosted
              MEDIUM: gemini-2.5-flash
              COMPLEX: reasoning-pool
              REASONING: frontier-pool
            tier_boundaries:
              simple_medium: 0.45
              medium_complex: 0.65
              complex_reasoning: 0.85

    general_settings:
      health_check_endpoint: /v1/health
      store_model_in_db: false

    router_settings:
      redis_url: os.environ/REDIS_URL
      routing_strategy: simple-shuffle
      cooldown_time: 30
      enable_pre_call_checks: true
      fallbacks:
        - self-hosted: ["gemini-2.5-flash"]
        - gemini-2.5-flash: ["self-hosted"]
      context_window_fallbacks:
        - gemini-2.5-flash: ["self-hosted"]

    litellm_settings:
      success_callback: ["prometheus"]
      failure_callback: ["prometheus"]
      prometheus_adapter: true
      require_auth_for_metrics_endpoint: false
      cache: true
      cache_params:
        type: redis
        url: os.environ/REDIS_URL
        ttl: 300
      drop_params: true
      request_timeout: 1200
      num_retries: 2
      retry_after: 5
      set_verbose: false

    environment:
      - GEMINI_API_KEY
      - OPENROUTER_API_KEY
      - CEREBRAS_API_KEY
      - HF_TOKEN
      - GROQ_API_KEY
      - MISTRAL_API_KEY
      - VERCEL_API_KEY
      - ILMU_API_KEY
      # - OVH_API_KEY
      - NVIDIA_API_KEY
      - REDIS_HOST
      - REDIS_PORT

  router.json: |
    {
      "encoder_type": "litellm",
      "encoder_name": "qwen/qwen3-4b-thinking-2507",
      "routes": [
        {
          "name": "self-hosted",
          "description": "placeholder — never matches; replace with real intent routes",
          "utterances": ["zzzz scaffold placeholder never match zzzz"],
          "score_threshold": 0.99
        }
      ]
    }
