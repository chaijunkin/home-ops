---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-inference-smoke-test
  namespace: ai
  labels:
    app.kubernetes.io/name: ai-inference-smoke-test
    app.kubernetes.io/part-of: litellm
spec:
  schedule: "0 */6 * * *" # Every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ai-inference-smoke-test
        spec:
          restartPolicy: OnFailure
          containers:
            - name: smoke-test
              image: curlimages/curl:8.12.1
              env:
                - name: LITELLM_MASTER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm
                      key: LITELLM_MASTER_KEY
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  echo "[$(date -u)] Initiating deep AI inference smoke test on local-pool-chat..."
                  
                  # 1. Bare metal health check
                  curl -sSf -m 5 "http://192.168.1.149:8732/health" > /dev/null
                  echo "[PASS] Qwen3.8 Flash Next /health is 200 OK"
                  
                  # 2. Live generation test through LiteLLM
                  RESP=$(curl -sSf -m 25 http://litellm.ai.svc.cluster.local:4000/v1/chat/completions \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
                    -d '{"model":"local-pool-chat","messages":[{"role":"user","content":"Count 1 to 10 with commas."}],"max_tokens":25}')
                  
                  # 3. Assert draft tokens and generation throughput
                  echo "$RESP" | grep -q "draft_tokens_accepted" || {
                    echo "[FAIL] Missing draft_tokens_accepted in response: $RESP"
                    exit 1
                  }
                  echo "[PASS] Live completion succeeded with MTP speculative decoding."

                  # 4. Behavioral Slice 1: Structured JSON Schema Validation
                  JSON_RESP=$(curl -sSf -m 25 http://litellm.ai.svc.cluster.local:4000/v1/chat/completions \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
                    -d '{"model":"local-pool-chat","messages":[{"role":"system","content":"You are a helpful assistant. Output valid JSON in your final answer."},{"role":"user","content":"Output valid JSON with keys \"status\" and \"code\"."}],"response_format":{"type":"json_object"},"max_tokens":120}')
                  echo "$JSON_RESP" | grep -q '"status"' && echo "$JSON_RESP" | grep -q '"code"' || {
                    echo "[FAIL] Structured JSON schema check failed: $JSON_RESP"
                    exit 1
                  }
                  echo "[PASS] Behavioral Slice 1 (Structured JSON Schema) passed."

                  # 5. Behavioral Slice 2: Reasoning & Comparative Logic
                  REASON_RESP=$(curl -sSf -m 25 http://litellm.ai.svc.cluster.local:4000/v1/chat/completions \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
                    -d '{"model":"local-pool-chat","messages":[{"role":"user","content":"Which number is bigger: 9.11 or 9.9?"}],"max_tokens":120}')
                  echo "$REASON_RESP" | grep -q "9.9" || {
                    echo "[FAIL] Behavioral reasoning check failed: $REASON_RESP"
                    exit 1
                  }
                  echo "[PASS] Behavioral Slice 2 (Reasoning & Comparative Logic) passed."
                  echo "[$(date -u)] Deep AI inference smoke test completed successfully."
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
