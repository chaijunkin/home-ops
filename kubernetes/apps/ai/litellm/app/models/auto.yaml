---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: auto
spec:
  modelName: auto
  proxyRef: litellm
  params:
    model: auto_router/complexity_router
    additional:
      complexity_router_default_model: local-pool-chat
      complexity_router_config:
        tiers:
          SIMPLE: local-pool-chat
          MEDIUM: local-pool-chat
          COMPLEX: qwen3.8-flash-next
          REASONING: qwen3.8-flash-next
        classifier_type: llm
        classifier_llm_config:
          model: local-pool-chat
          timeout_ms: 20000
        classifier_fallback: default_model
        session_affinity: true
        session_affinity_ttl_seconds: 3600
