---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: auto
spec:
  modelName: auto
  proxyRef: litellm
  params:
    model: auto_router/complexity_router
    additional:
      complexity_router_default_model: glm-5.3-flash
      complexity_router_config:
        tiers:
          SIMPLE: qwen3.8-flash-next-chat
          MEDIUM: glm-5.3-flash
          COMPLEX: opencode-go/deepseek-v4-flash
          REASONING: opencode-go/deepseek-v4-flash
        classifier_type: llm
        classifier_llm_config:
          model: qwen3.8-flash-next-chat
          timeout_ms: 20000
        classifier_fallback: default_model
        session_affinity: true
        session_affinity_ttl_seconds: 3600
