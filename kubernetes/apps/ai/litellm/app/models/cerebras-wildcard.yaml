# yaml-language-server: $schema=https://crd.cloudjur.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: cerebras-wildcard
spec:
  modelName: cerebras/*
  proxyRef: litellm
  params:
    model: cerebras/*
    apiKeyRef:
      name: litellm
      key: CEREBRAS_API_KEY
    dropParams: true
