---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: free-pool-gemini
spec:
  modelName: free-pool
  proxyRef: litellm
  params:
    model: gemini/gemini-2.5-flash
    apiKeyRef:
      name: litellm
      key: GEMINI_API_KEY
    dropParams: true
    additional:
      order: 1
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 16384
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: free-pool-openrouter
spec:
  modelName: free-pool
  proxyRef: litellm
  params:
    model: openrouter/openrouter/free
    apiKeyRef:
      name: litellm
      key: OPENROUTER_API_KEY
    dropParams: true
    additional:
      order: 2
  info:
    mode: chat
    maxInputTokens: 200000
    maxOutputTokens: 16384
