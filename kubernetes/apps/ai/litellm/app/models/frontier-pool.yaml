---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: frontier-pool-1
spec:
  modelName: frontier-pool
  proxyRef: litellm
  params:
    model: openai/glm-5.3-flash
    apiBase: https://opencode.ai/zen/go/v1
    apiKeyRef:
      name: litellm
      key: OPENCODE_GO_API_KEY
    dropParams: true
    additional:
      order: 1
      extra_headers:
        x-opencode-session: "litellm-proxy"
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      supports_reasoning: true
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: frontier-pool-2
spec:
  modelName: frontier-pool
  proxyRef: litellm
  params:
    model: openai/openrouter/auto
    apiBase: https://openrouter.ai/api/v1
    apiKey: os.environ/OPENROUTER_API_KEY
    additional:
      order: 2
  info:
    mode: chat
    maxInputTokens: 200000
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    supportsVision: true
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: frontier-pool-3
spec:
  modelName: frontier-pool
  proxyRef: litellm
  params:
    model: openai/default
    apiBase: https://api.ilmu.ai/v1
    apiKey: os.environ/ILMU_API_KEY
    additional:
      order: 3
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 16384
    supportsFunctionCalling: true
