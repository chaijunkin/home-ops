# yaml-language-server: $schema=https://crd.cloudjur.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: hf-wildcard
spec:
  modelName: hf/*
  proxyRef: litellm
  params:
    model: openai/*
    apiBase: https://router.huggingface.co/v1
    apiKeyRef:
      name: litellm
      key: HF_TOKEN
    dropParams: true
