# yaml-language-server: $schema=https://crd.cloudjur.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: memini-embed
spec:
  modelName: memini-embed
  proxyRef: litellm
  params:
    model: openai/memini-embed
    apiBase: http://memini-embed.ai:8080/v1
    apiKey: memini-embed
  info:
    mode: embedding
    maxInputTokens: 32768
    extra:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
