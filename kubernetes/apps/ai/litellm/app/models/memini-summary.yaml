# yaml-language-server: $schema=https://crd.cloudjur.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: memini-summary
spec:
  modelName: memini-summary
  proxyRef: litellm
  params:
    model: hosted_vllm/qwen3.8-flash-next
    apiBase: http://192.168.1.149:8732/v1
    apiKey: gufo-key
    dropParams: true
    additional:
      temperature: 0.7
      top_p: 0.8
      reasoning_effort: none
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 245760
    maxOutputTokens: 16384
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    extra:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
