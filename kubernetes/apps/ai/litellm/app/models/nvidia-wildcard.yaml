# yaml-language-server: $schema=https://crd.cloudjur.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: nvidia-wildcard
spec:
  modelName: nvidia/*
  proxyRef: litellm
  params:
    model: openai/*
    apiBase: https://integrate.api.nvidia.com/v1
    apiKeyRef:
      name: litellm
      key: NVIDIA_API_KEY
    dropParams: true
