# yaml-language-server: $schema=https://crd.cloudjur.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: opencode-go-claude-sonnet-5-5
spec:
  modelName: opencode-go/claude-sonnet-5-5
  params:
    model: anthropic/claude-sonnet-5-5
    apiBase: https://opencode.ai/zen/go
    apiKeyRef:
      name: litellm
      key: OPENCODE_GO_API_KEY
    dropParams: true
    additional:
      extra_headers:
        x-opencode-session: "litellm-proxy"
  info:
    maxInputTokens: 200000
    maxOutputTokens: 8192
    supportsFunctionCalling: true
