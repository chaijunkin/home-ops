# yaml-language-server: $schema=https://crd.cloudjur.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-1
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/gemini-2.5-flash-lite
    apiBase: https://generativelanguage.googleapis.com/v1beta/openai
    apiKey: os.environ/GEMINI_API_KEY
    additional:
      order: 1
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: true
