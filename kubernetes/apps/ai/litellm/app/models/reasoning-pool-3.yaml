# yaml-language-server: $schema=https://crd.cloudjur.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-3
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/Qwen/Qwen3-32B
    apiBase: https://router.huggingface.co/v1
    apiKey: os.environ/HF_TOKEN
    additional:
      order: 3
  info:
    mode: chat
    maxInputTokens: 40960
    maxOutputTokens: 8192
    supportsFunctionCalling: true
