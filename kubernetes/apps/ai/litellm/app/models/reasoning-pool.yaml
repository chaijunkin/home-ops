---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-1
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/deepseek-v4-flash
    apiBase: https://opencode.ai./zen/go/v1
    apiKeyRef:
      name: litellm
      key: OPENCODE_GO_API_KEY
    dropParams: true
    additional:
      order: 2
      extra_headers:
        x-opencode-session: "litellm-proxy"
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      supports_reasoning: true
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-2
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/qwen/qwen3-235b-a22b
    apiBase: https://integrate.api.nvidia.com/v1
    apiKey: os.environ/NVIDIA_API_KEY
    additional:
      order: 1
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 32768
    supportsFunctionCalling: true
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-3
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/Qwen/Qwen3-32B
    apiBase: https://router.huggingface.co/v1
    apiKey: os.environ/HF_TOKEN
    additional:
      order: 3
  info:
    mode: chat
    maxInputTokens: 40960
    maxOutputTokens: 8192
    supportsFunctionCalling: true
