# yaml-language-server: $schema=https://crd.cloudjur.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litellm
spec:
  groups:
    - name: litellm.rules
      rules:
        # LiteLLM exports no *_fallbacks_total counters, so both rules below derive the same two
        # facts from the per-deployment counters that do exist (litellm_deployment_success_responses_total
        # and litellm_deployment_failure_responses_total, labelled by pool in model_group):
        #   exhausted -> the pool is failing and serving nothing, so nothing is left to fall back to
        #   failover  -> the pool is failing while it still answers, i.e. a deployment in it is unhealthy
        # unless on (model_group) rather than a failure ratio, because an absent success series has to
        # count as "nothing is working" and division by a missing denominator cannot express that.
        # for: 10m is new: the old rule had none, and a cold proxy with no success traffic yet would
        # otherwise page on its first failed request.
        - alert: LiteLLMFallbackChainExhausted
          expr: |-
            sum by (model_group) (increase(litellm_deployment_failure_responses_total[15m])) > 0
            unless on (model_group)
            sum by (model_group) (increase(litellm_deployment_success_responses_total[15m])) > 0
          for: 10m
          annotations:
            summary: >-
              LiteLLM pool {{ $labels.model_group }} is failing requests with nothing in it
              succeeding — no deployment left to serve this traffic
          labels:
            severity: critical
        - alert: LiteLLMModelFailover
          expr: |-
            sum by (model_group, exception_status) (increase(litellm_deployment_failure_responses_total[10m])) > 3
            and on (model_group)
            sum by (model_group) (increase(litellm_deployment_success_responses_total[10m])) > 0
          for: 5m
          annotations:
            summary: >-
              LiteLLM pool {{ $labels.model_group }} failed {{ $value }} request(s) with
              {{ $labels.exception_status }} in 10m while the pool still answered — one of its
              deployments is unhealthy
          labels:
            severity: warning
        - alert:
            LiteLLMDeploymentOutage
            # deployment_state latches at 2 via the cooldown callback's pool label and
            # never resets (success callbacks label by requested model). Require
            # ongoing failures so a recovered deployment doesn't alert forever.
          expr: |-
            max by (litellm_model_name) (litellm_deployment_state) >= 2
            and on (litellm_model_name)
            sum by (litellm_model_name) (rate(litellm_deployment_failure_responses_total[15m])) > 0
          for: 10m
          annotations:
            summary: >-
              LiteLLM {{ $labels.litellm_model_name }} out of rotation and still failing
              (deployment_state >= 2)
          labels:
            severity: warning
        - alert: LiteLLMAuthOrQuotaFailures
          expr: |-
            sum by (litellm_model_name, exception_status) (
              increase(litellm_deployment_failure_responses_total{exception_status=~"403|429"}[15m])
            ) > 5
          for: 5m
          annotations:
            summary: >-
              LiteLLM {{ $labels.litellm_model_name }} returning {{ $labels.exception_status
              }}
              (auth/quota — check the upstream key or plan cap)
          labels:
            severity: warning
    - name: llamacpp.rules
      rules:
        - alert:
            LlamaCppRequestsDeferred
            # A llama-server defers a request when every slot is busy. Sustained
            # deferral means the loop is serialising on that model rather than on
            # agent capacity — llama-nvidia runs --parallel 1, so the coder lane
            # queues here long before it queues anywhere else. This is the signal
            # that settles whether to raise --parallel or lower the bridge's
            # CODER_AGENT_SLOTS, rather than guessing at either.
          expr: |-
            max by (service) (llamacpp:requests_deferred) > 0
          for: 10m
          annotations:
            summary: >-
              {{ $labels.service }} has had {{ $value }} request(s) queued behind its
              inference slots for 10m — work is serialising on this model
          labels:
            severity: warning
    - name: aiobservability.rules
      rules:
        - alert: LiteLLMDown
          expr: up{job="litellm"} == 0
          for: 2m
          annotations:
            summary: LiteLLM proxy instance {{ $labels.instance }} is down
            description: LiteLLM proxy has been unreachable for more than 2 minutes.
          labels:
            severity: critical
        - alert: AIObservabilityLocalLLMDown
          expr: up{job="gufo"} == 0
          for: 2m
          annotations:
            summary: Local LLM backend {{ $labels.instance }} is offline
            description: Gufo/vLLM inference on Strix Halo ({{ $labels.instance }}) has been unreachable for >2m.
          labels:
            severity: critical
        - alert: AIObservabilityHighFailureRate
          expr: |-
            sum by (requested_model) (rate(litellm_deployment_failure_responses_total[5m]))
            /
            (sum by (requested_model) (rate(litellm_requests_metric_total[5m])) + 0.001) * 100 > 10
          for: 5m
          annotations:
            summary: LiteLLM model {{ $labels.requested_model }} high failure rate (>10%)
            description: More than 10% of requests to model {{ $labels.requested_model }} are failing over 5m.
          labels:
            severity: critical
        - alert: AIObservabilityHighLatencyP95
          expr: histogram_quantile(0.95, sum by (le, requested_model) (rate(litellm_request_total_latency_metric_bucket[5m]))) > 30
          for: 10m
          annotations:
            summary: LiteLLM model {{ $labels.requested_model }} P95 latency high (>30s)
            description: 95th percentile latency for {{ $labels.requested_model }} exceeded 30s for 10m.
          labels:
            severity: warning
        - alert: AIObservabilityAPUMemoryPressure
          expr: (node_memory_MemAvailable_bytes{instance="192.168.1.149:9100"} / node_memory_MemTotal_bytes{instance="192.168.1.149:9100"}) * 100 < 5
          for: 5m
          annotations:
            summary: Strix Halo APU host memory under severe pressure (<5% available)
            description: Available memory on Strix Halo APU is under 5% (<6GB), threatening a Gufo/Podman OOM crash.
          labels:
            severity: warning
        - alert: AIObservabilityGPUDeviceLost
          expr: gufo_device_lost_total > 0
          for: 0m
          annotations:
            summary: Strix Halo GPU compute device lost (driver/kernel fault)
            description: Gufo runtime reported a GPU device loss event on {{ $labels.instance }}. The AMD KFD/ROCm driver has faulted.
          labels:
            severity: critical
        - alert: AIObservabilitySpecDecodeAcceptanceLow
          expr: |-
            (sum by (service) (rate(llamacpp:spec_decode_num_accepted_tokens_total[15m]))
            /
            clamp_min(sum by (service) (rate(llamacpp:spec_decode_num_draft_tokens_total[15m])), 0.0001)) * 100 < 40
            and sum by (service) (rate(llamacpp:spec_decode_num_draft_tokens_total[15m])) > 0.1
          for: 15m
          annotations:
            summary: Speculative decoding acceptance rate below 40% on {{ $labels.service }}
            description: Speculative draft token acceptance rate has fallen below 40% over 15m, signaling draft model divergence or quantization mismatch.
          labels:
            severity: warning
