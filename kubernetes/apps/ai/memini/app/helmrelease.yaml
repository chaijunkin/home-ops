# yaml-language-server: $schema=https://crd.cloudjur.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  chartRef:
    kind: OCIRepository
    name: memini
  interval: 30m
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          main:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
              MEMINI_BACKEND: sqlite
              MEMINI_DEFAULT_NAMESPACE: default
              MEMINI_DEDUP_SIMILARITY: "0.80"
              MEMINI_SHORT_TERM_CAP: "300"
              MEMINI_DEMOTE_AFTER: 1440h
              MEMINI_DISTILL_ON_WRITE: "true"
              MEMINI_REEMBED_ON_MODEL_CHANGE: "true"
              MEMINI_EMBED_BASE_URL: http://litellm.ai:4000/v1
              MEMINI_EMBED_MODEL: memini-embed
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_EMBED_MAX_CONCURRENCY: "2"
              MEMINI_EMBED_MAX_ITEM_CHARS: "6000"
              MEMINI_EMBED_QUERY_PREFIX:
                "Instruct: Given a user message, retrieve
                relevant past memories\nQuery: "
              MEMINI_LLM_BASE_URL: http://litellm.ai:4000/v1
              MEMINI_LLM_MODEL: gemini-2.5-flash-lite
              MEMINI_LOG_FORMAT: json
              MEMINI_RECALL_MIN_SEMANTIC_SCORE: "0.46"
              MEMINI_RERANK: http://memini-rerank.ai:8080/v1
              MEMINI_RERANK_MODEL: memini-rerank
              MEMINI_RERANK_POOL: "50"
              MEMINI_RERANK_MAX_BATCH_CHARS: "120000"
              MEMINI_RERANK_TIMEOUT: 15s
              MEMINI_TOMBSTONE_TTL: 720h
            envFrom:
              - secretRef:
                  name: memini-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      fsck:
        enabled: true
        cronjob:
          schedule: 0 5 * * *
        containers:
          fsck:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
    persistence:
      data:
        existingClaim: memini
    route:
      ui:
        enabled: true
        hostnames:
          - memini.cloudjur.com
        parentRefs:
          - name: envoy-internal
            namespace: network
    serviceMonitor:
      main:
        enabled: true
    grafanaDashboards:
      enabled: true
      folder: llm
