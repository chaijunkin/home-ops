apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-oikb-config
data:
  .oikb.yaml: |
    defaults:
      interval: 1h
      concurrency: 2
    sources:
      - name: DefaultVault
        source: /mnt/defaultvault
        kb-id: cjk-defaultvault
        filter:
          exclude:
            - ".obsidian/**"
            - ".trash/**"
            - ".git/**"
