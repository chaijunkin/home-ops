          #     limits:
          #       memory: 500Mi
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.10.30.45
          gatus.home-operations.com/endpoint: |-
            name: open-webui-lb
            group: services
        ports:
          http:
            port: &port 8080
    persistence:
      config:
        enabled: true
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data
      default-vault:
        type: nfs
        server: smb.cloudjur.com
        path: /tank/Apps/Obsidian/DefaultVault
        globalMounts:
          - path: /mnt/defaultvault
            readOnly: true
      # oikb-config:
      #   type: configMap
      #   name: open-webui-oikb-config
      #   advancedMounts:
      #     open-webui:
      #       oikb:
      #         - path: /app/.oikb.yaml
      #           subPath: .oikb.yaml
      #           readOnly: true
    route:
      app:
        hostnames:
          # - open-webui.cloudjur.com
          - chat.cloudjur.com
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - port: *port
                name: open-webui
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Application Service
          gethomepage.dev/name: Open WebUI
          gethomepage.dev/description: AI Chat services
          gethomepage.dev/icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/open-webui.png
