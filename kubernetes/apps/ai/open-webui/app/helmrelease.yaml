# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h # interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.12.0@sha256:1565038903151ced924b5a3226f73f40f16963df4b910441f6391f10144afdaa
            env:
              # ENV: dev
              CORS_ALLOW_ORIGIN: https://chat.cloudjur.com
              WEBUI_URL: https://chat.cloudjur.com
              # Monitoring
              ENABLE_OTEL: true
              ENABLE_OTEL_METRICS: true
              OTEL_SERVICE_NAME: open-webui
              OTEL_EXPORTER_OTLP_ENDPOINT: http://k8s-monitoring-alloy-receiver.observability:4317
              # OTEL_EXPORTER_OTLP_ENDPOINT: http://kube-prometheus-stack-prometheus.observability:9090/api/v1/otlp/v1/metrics
              # OTEL_METRICS_OTLP_SPAN_EXPORTER: http
              OTEL_EXPORTER_OTLP_INSECURE: true
              ENABLE_OTEL_TRACES: false
              # Open-webui settings
              ENABLE_OPENAI_API: true
              OPENAI_API_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              ENABLE_OLLAMA_API: false

              # Image Generation via ComfyUI
              ENABLE_IMAGE_GENERATION: true
              IMAGE_GENERATION_ENGINE: comfyui
              COMFYUI_BASE_URL: http://comfyui.ai.svc.cluster.local:8188/

              # Text-to-Speech via LiteLLM -> Qwen3-TTS
              AUDIO_TTS_ENGINE: openai
              AUDIO_TTS_OPENAI_API_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              AUDIO_TTS_OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-secret"
                    key: OPENAI_API_KEY
              AUDIO_TTS_MODEL: qwen3-tts

              # Speech-to-Text via LiteLLM -> Qwen3-ASR
              AUDIO_STT_ENGINE: openai
              AUDIO_STT_OPENAI_API_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              AUDIO_STT_OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-secret"
                    key: OPENAI_API_KEY
              AUDIO_STT_MODEL: qwen3-asr

              # Web Search
              ENABLE_RAG_WEB_SEARCH: true
              ENABLE_SEARCH_QUERY: true
              WEB_SEARCH_ENGINE: searxng
              RAG_WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: http://searxng.default:8080/search?q=<query>
              ENABLE_WEBSOCKET_SUPPORT: "true"
              WEBSOCKET_MANAGER: redis
              WEBSOCKET_REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379/15
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 10m
                memory: 50Mi
              limits:
                memory: 2Gi
          # oikb:
          #   image:
          #     repository: ghcr.io/open-webui/oikb
          #     tag: 0.4.0@sha256:e61c1beef9fe91d2f00ca8612e847eacc7d579e2e8e258f40fb1ef3e2891e8d4
          #   command:
          #     - sh
          #     - -c
          #     - |
          #       echo "Waiting for Open WebUI on port 8080..."
          #       until wget -q --spider http://127.0.0.1:8080/health 2>/dev/null || python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')" 2>/dev/null; do
          #         sleep 2
          #       done
          #       echo "Open WebUI is ready! Starting oikb daemon..."
          #       exec oikb daemon --port 8081
          #   env:
          #     OPEN_WEBUI_URL: http://127.0.0.1:8080
          #     LOG_FORMAT: json
          #   envFrom:
          #     - secretRef:
          #         name: "{{ .Release.Name }}-secret"
          #   probes:
          #     liveness:
          #       enabled: true
          #       custom: true
          #       spec:
          #         httpGet:
          #           path: /health
          #           port: 8081
          #         initialDelaySeconds: 15
          #         periodSeconds: 30
          #         timeoutSeconds: 5
          #         failureThreshold: 3
          #     readiness:
          #       enabled: true
          #       custom: true
