# yaml-language-server: $schema=https://crd.cloudjur.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
  namespace: ai
spec:
  targetNamespace: ai
  path: ./kubernetes/apps/ai/open-webui/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 24h
  retryInterval: 1m

  postBuild:
    substitute:
      APP: open-webui
      SUBDOMAIN: chat
      KOPIUR_CAPACITY: 20Gi
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/kopiur/remote
      # - ../../../../components/kopiur/adhoc-snapshot
  dependsOn:
    - name: openebs
      namespace: storage
