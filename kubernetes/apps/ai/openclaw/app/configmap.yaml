# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
data:
  openclaw.json: |
    {
      agents: {
        defaults: {
          contextInjection: "always",
          bootstrapMaxChars: 50000,
          bootstrapTotalMaxChars: 100000,
          thinkingDefault: "high",
          timeoutSeconds: 600,
          "model": {
            "primary": "litellm/glm-5.3-flash",
            "fallbacks": [
              "litellm/dsv4f",
              "litellm/gemini-2.5-flash-lite",
              "litellm/self-hosted",
              "litellm/openrouter/deepseek/deepseek-chat",
            ]
          },
          "imageModel": {
            "primary": "litellm/self-hosted",
            "fallbacks": [
              "litellm/gemini-2.5-flash-lite",
            ]
          },
          "imageGenerationModel": {
            "primary": "comfy/workflow",
          },
          "models": {
            "litellm/glm-5.3-flash": { "alias": "glm-5.3-flash" },
            "litellm/dsv4f": { "alias": "dsv4f" },
            "litellm/gemini-2.5-flash-lite": { "alias": "gemini-flash" },
            "litellm/self-hosted": { "alias": "skirk", "params": { "cache_prompt": true } },
            "litellm/openrouter/deepseek/deepseek-chat": { "alias": "deepseek-chat" },
          },
          "memorySearch": {
            "provider": "openai",
            "model": "sentence-transformers/all-MiniLM-L6-v2",
            "remote": {
              "baseUrl": "http://litellm.ai:8080/v1",
              "apiKey": "llama-embed"
            }
          },
          "contextPruning": { "mode": "off" },
          "compaction": { "mode": "default", "reserveTokensFloor": 30000, "memoryFlush": { "enabled": true, "softThresholdTokens": 80000, "prompt": "Extract key decisions, state changes, lessons, blockers to memory/YYYY-MM-DD.md. Format: ## [HH:MM] Topic. Skip routine work. NO_FLUSH if nothing important.", "systemPrompt": "Compacting session context. Extract only what's worth remembering. No fluff." },
          },
          "maxConcurrent": 4,
          "subagents": {
            "model": {
              "primary": "litellm/glm-5.3-flash",
            },
            "archiveAfterMinutes": 120,
            "maxConcurrent": 3,
            "thinking": "high",
          },
          "heartbeat": {
            "every": "60m",
            "model": "litellm/self-hosted",
            "directPolicy": "allow",
            "lightContext": false,
            "isolatedSession": false,
            "includeReasoning": false,
          },
        },
        "list": [],
      },
      "tools": {
        "media": { "image": { "timeoutSeconds": 180 } },
        "sessions": { "visibility": "all" },
        "agentToAgent": { "enabled": true },
        "exec": { "security": "full", "ask": "off", "strictInlineEval": false },
        "elevated": { "enabled": true, "allowFrom": { "discord": ["$${DISCORD_ADMIN_USER_ID}"] } },
        "web": { "search": { "enabled": true, "provider": "searxng", "openaiCodex": { "enabled": true, "mode": "cached" } }, "fetch": { "enabled": true } },
      },
      "commands": {
        "native": "auto",
        "nativeSkills": "auto",
        "restart": false,
      },
      "models": {
        "providers": {
          "litellm": {
            "baseUrl": "http://litellm.ai:4000/v1",
            "apiKey": "$${LITELLM_API_KEY}",
            "api": "openai-completions",
            "timeoutSeconds": 600,
            "models": [
              { "id": "glm-5.3-flash", "name": "GLM 5.3 Flash", "reasoning": true, "input": ["text", "image"], "cost": { "input": 0.15, "output": 0.50, "cacheRead": 0.03, "cacheWrite": 0.15 }, "contextWindow": 1000000, "maxTokens": 131072 },
              { "id": "dsv4f", "name": "DeepSeek V4 Flash", "reasoning": true, "input": ["text"], "cost": { "input": 0.22, "output": 0.66, "cacheRead": 0.007, "cacheWrite": 0.22 }, "contextWindow": 1000000, "maxTokens": 16384 },
              { "id": "gemini-2.5-flash-lite", "name": "Gemini 3 Flash", "reasoning": true, "input": ["text", "image"], "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 }, "contextWindow": 1048576, "maxTokens": 65536 },
              { "id": "self-hosted", "name": "Qwen3.6-35B-A3B UD Q8_K_XL (ROCm)", "reasoning": true, "input": ["text", "image"], "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 }, "contextWindow": 262144, "maxTokens": 16384 },
              { "id": "openrouter/deepseek/deepseek-chat", "name": "DeepSeek Chat (OpenRouter)", "reasoning": true, "input": ["text"], "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 }, "contextWindow": 128000, "maxTokens": 8192 },
              { "id": "kimi-k2.6", "name": "Kimi K2.6", "reasoning": true, "input": ["text"], "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 }, "contextWindow": 262144, "maxTokens": 262144 },
              { "id": "glm-5.1", "name": "GLM 5.1", "reasoning": true, "input": ["text"], "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 }, "contextWindow": 204800, "maxTokens": 131072 },
              { "id": "qwen3.6-plus", "name": "Qwen 3.6 Plus", "reasoning": true, "input": ["text"], "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 }, "contextWindow": 991808, "maxTokens": 65536 }
            ]
          }
        }
      },
      auth: {
        profiles: {
          "litellm:default": { provider: "litellm", mode: "api_key" },
        },
      },
      bindings: [
        { agentId: "main",    match: { channel: "discord", accountId: "default" } },
      ],
      channels: {
        discord: {
          enabled: true,
          defaultAccount: "default",
          actions: {
            messages: true,
            channels: true,
            search: true,
            reactions: false,
            stickers: false,
            polls: false,
            permissions: false,
            threads: false,
            pins: false,
            memberInfo: false,
            roleInfo: false,
            roles: false,
            channelInfo: false,
            voiceStatus: false,
            events: false,
            moderation: false,
            emojiUploads: false,
            stickerUploads: false,
          },
          streaming: { block: { enabled: false } },
          groupPolicy: "allowlist",
          dmPolicy: "pairing",
          accounts: {
            default: {
              token: "$${DISCORD_BOT_TOKEN}",
            },
          },
        },
      },
      plugins: {
        allow: ["discord", "lossless-claw", "memini", "searxng", "openclaw-better-gateway"],
        entries: {
          discord: { enabled: true },
          comfy: {
            enabled: true,
            config: {
              mode: "local",
              allowPrivateNetwork: true,
              baseUrl: "http://10.69.10.44:8188",
              image: {
                workflowPath: "/home/node/.openclaw/workflows/openclaw-generate.json",
                promptNodeId: "2",
                outputNodeId: "7",
              },
            },
          },
          "openclaw-better-gateway": {
            enabled: true,
            config: {
              reconnectIntervalMs: 3000,
              maxReconnectAttempts: 10,
              maxFileSize: 10485760,
              autoReconnectOnGap: true,
              autoReconnectOnVisibility: true,
              visibilityReconnectThresholdMs: 30000,
            },
          },
          "admin-http-rpc": { enabled: true },
          "lossless-claw": {
            enabled: true,
            llm: { allowModelOverride: true, allowedModels: [ "litellm/summary" ], },
            subagent: { allowModelOverride: true, allowedModels: [ "litellm/summary" ], },
            config: {
              contextThreshold: 0.75,
              delegationTimeoutMs: 1000000,
              expansionModel: "litellm/summary",
              freshTailCount: 64,
              freshTailMaxTokens: 24000,
              ignoreSessionPatterns: [
                "agent:*:cron:**",
                "agent:*:heartbeat:**",
                "heartbeat:**",
                "**:heartbeat:**"
              ],
              incrementalMaxDepth: 1,
              leafChunkTokens: 20000,
              newSessionRetainDepth: 2,
              proactiveThresholdCompactionMode: "deferred",
              pruneHeartbeatOk: true,
              skipStatelessSessions: true,
              statelessSessionPatterns: [ "agent:*:subagent:**" ],
              summaryModel: "litellm/summary",
              summaryTimeoutMs: 1000000,
              transcriptGcEnabled: false,
            },
          },
          searxng: {
            enabled: true,
            config: {
              webSearch: {
                baseUrl: "http://searxng.ai:8080",
                language: "en"
              }
            }
          },
          "memory-wiki": {
            enabled: true,
            config: {
              vaultMode: "bridge",
              vault: {
                path: "/home/node/.openclaw/wiki/main",
                renderMode: "native",
              },
              bridge: {
                enabled: true,
                readMemoryArtifacts: true,
                indexDreamReports: true,
                indexDailyNotes: true,
                indexMemoryRoot: true,
                followMemoryEvents: true,
              },
              search: {
                backend: "shared",
                corpus: "all",
              },
              render: {
                preserveHumanBlocks: true,
                createBacklinks: true,
                createDashboards: true,
              },
            },
          },
          openai: {
            enabled: true,
          },
          browser: {
            enabled: true,
          },
          "memory-core": {
            enabled: true,
          },
          memini: {
            enabled: true,
            hooks: {
              allowConversationAccess: true,
            },
            config: {
              base_url: "http://memini.ai:8080",
              namespace: "openclaw",
              namespace_per_agent: true,
              namespace_template: "{namespace}/{agent}",
              skip_without_agent: true,
              skip_system_turns: true,
              fallback_on_error: true,
              timeout_ms: 15000,
              recall_limit: 3,
              expose_tools: true,
            },
          },
        },
        slots: {
          memory: "memini",
          contextEngine: "lossless-claw"
        },
      },
      session: {
        dmScope: "main",
        reset: {
          mode: "idle",
          idleMinutes: 1440,
        },
        maintenance: {
          mode: "enforce",
          pruneAfter: "7d",
          maxEntries: 1000,
          resetArchiveRetention: "7d",
        },
      },
      gateway: {
        auth: { mode: "token", token: "$${OPENCLAW_GATEWAY_TOKEN}" },
        "bind": "custom",
        "customBindHost": "::",
        controlUi: {
          allowInsecureAuth: true,
          allowedOrigins: [
            "https://openclaw.cloudjur.com",
            "https://chat.cloudjur.com",
          ],
        },
        http: {
          endpoints: {
            chatCompletions: { enabled: true },
          },
        },
        mode: "local",
        nodes: {
          denyCommands: [
            "camera.snap",
            "camera.clip",
            "screen.record",
            "contacts.add",
            "calendar.add",
            "reminders.add",
            "sms.send",
            "sms.search",
          ],
        },
        port: 18789,
        trustedProxies: ["10.69.0.0/16", "192.168.0.0/16", "10.0.0.0/8",  "fd42::/56"],
      },
      messages: {
        ackReactionScope: "group-mentions",
        responsePrefix: "[{model}]"
      },
      mcp: {
        servers: {
          toolhive: {
            url: "http://vmcp-mcp-gateway-internal.ai:4483/mcp",
            transport: "streamable-http",
            headers: {
              Accept: "application/json, text/event-stream",
            },
          },
          context7: {
            url: "https://mcp.context7.com/mcp",
            transport: "streamable-http",
            headers: {
              CONTEXT7_API_KEY: "$${CONTEXT7_API_KEY}",
            },
          },
        },
      },
      skills: {
        entries: {
          "1password": {
            enabled: false
          },
          "apple-notes": {
            enabled: false
          },
          "apple-reminders": {
            enabled: false
          },
          "bear-notes": {
            enabled: false
          },
          blogwatcher: {
            enabled: false
          },
          blucli: {
            enabled: false
          },
          camsnap: {
            enabled: false
          },
          clawhub: {
            enabled: false
          },
          "coding-agent": {
            enabled: false
          },
          discord: {
            enabled: false
          },
          eightctl: {
            enabled: false
          },
          gemini: {
            enabled: false
          },
          gifgrep: {
            enabled: false
          },
          gog: {
            enabled: false
          },
          goplaces: {
            enabled: false
          },
          himalaya: {
            enabled: false
          },
          imsg: {
            enabled: false
          },
          mcporter: {
            enabled: false
          },
          "model-usage": {
            enabled: false
          },
          "nano-pdf": {
            enabled: false
          },
          obsidian: {
            enabled: false
          },
          "openai-whisper": {
            enabled: false
          },
          "openai-whisper-api": {
            enabled: false
          },
          openhue: {
            enabled: false
          },
          oracle: {
            enabled: false
          },
          ordercli: {
            enabled: false
          },
          peekaboo: {
            enabled: false
          },
          sag: {
            enabled: false
          },
          "sherpa-onnx-tts": {
            enabled: false
          },
          slack: {
            enabled: false
          },
          songsee: {
            enabled: false
          },
          sonoscli: {
            enabled: false
          },
          "spotify-player": {
            enabled: false
          },
          summarize: {
            enabled: false
          },
          "things-mac": {
            enabled: false
          },
          tmux: {
            enabled: false
          },
          trello: {
            enabled: false
          },
          "video-frames": {
            enabled: false
          },
          "voice-call": {
            enabled: false
          },
          wacli: {
            enabled: false
          },
          xurl: {
            enabled: false
          },
        },
      },
    }
