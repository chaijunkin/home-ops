---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    git config --global user.name "cjk-bot[bot]"
    git config --global user.email "162876455+cjk-bot[bot]@users.noreply.github.com"
    git config --global init.defaultBranch main
    git config --global credential.helper store
    git config --global --add safe.directory '*'

    umask 077
    printf 'https://x-access-token:%s@github.com\n' "${GITHUB_TOKEN}" > "${HOME}/.git-credentials"
    umask 022

    mkdir -p "${HOME}/Developer/github.com/chaijunkin"
    if [[ ! -d "${HOME}/Developer/github.com/chaijunkin/home-ops/.git" ]]; then
      git clone --filter=blob:none https://github.com/chaijunkin/home-ops.git "${HOME}/Developer/github.com/chaijunkin/home-ops" \
        || echo "WARN: home-ops clone failed; clone it from a session instead"
    fi

    cd "${HOME}/Developer/github.com/chaijunkin/home-ops"
    exec opencode serve --hostname 0.0.0.0 --port 4096
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "litellm/local-pool-chat",
      "permission": "allow",
      "compaction": { "auto": true, "prune": true, "keep": { "tokens": 20000 }, "buffer": 32768 },
      "tool_output": { "max_lines": 800, "max_bytes": 16384 },
      "plugins": [
        { "package": "@eleboucher/opencode-memini-v2@0.7.32", "options": { "base_url": "http://memini.ai:8080", "namespace": "opencode", "auto_update": false } }
      ],
      "enabled_providers": ["litellm", "litellm-anthropic"],
      "agent": {
        "coordinator": {
          "description": "Reasoning coordinator — plans, then delegates to role subagents (explorer/implementer/coder-local/agentic-local/oracle/reviewer)",
          "mode": "primary",
          "model": "litellm/reasoning-pool",
          "prompt": "You are a coordinator. Do the high-level reasoning and synthesis yourself; delegate the legwork to role subagents via the task tool.\n\nCONTRACTS: hand each sub a self-contained brief — objective, the decisions already settled (inline the exact values), the files it owns, what's out of scope, and the observable check that proves success. A sub should never have to infer scope or re-derive a decision you already made. Ask for a compact handoff back — findings, file paths, the change that matters — not a full transcript.\n\nROLES:\n- `explorer` (local-pool-chat — Qwen3.8-Flash-Next on Strix): default recon, read-only scouting, 'where/how is X'.\n- `implementer` (implementation-pool — Qwen3.8-Flash-Next -> Free Pool): the DEFAULT coding lane. Route edits here first — small scoped edits and mechanical changes as well as multi-file edits, refactors and long implementation runs.\n- `agentic-local` (qwen3.8-flash-next, Qwen3.8-Flash-Next IQ4_NL on Strix — local, free, 245k, vision): the long-horizon agentic lane. Route long multi-step work here.\n- `oracle` (reasoning-pool): hard debugging, root-cause, architecture.\n- `coder-local` (local-pool-chat — local, free, 245k, vision): primary local coding lane.\n- `reviewer` (qwen3.8-flash-next / free-pool): independent second opinion and adversarial review.\n\nQUALITY PASS (before you report done): after a substantive change, dispatch a fresh `reviewer` subagent for an ADVERSARIAL pass over the diff. Brief it to assume the change is broken and prove it."
        },
        "vision-local": {
          "description": "Local vision lane - Qwen3.8-Flash-Next on Strix (245k, images). Use for screenshots, diagrams, OCR and any image input.",
          "mode": "subagent",
          "model": "litellm/qwen3.8-flash-next",
          "prompt": "You read images. Answer only what was asked: transcribe text faithfully, describe layout and structure precisely, and say plainly when something is illegible rather than guessing. Keep it compact - you are feeding a coordinator, not a human reader."
        },
        "coordinator-local": {
          "description": "Local-only coordinator - Qwen3.8-Flash-Next (qwen3.8-flash-next, 245k, vision) plans, delegates edits and recon to coder-local and review to agentic-local. No rate caps, no cloud.",
          "mode": "primary",
          "model": "litellm/qwen3.8-flash-next",
          "prompt": "You are a LOCAL-ONLY coordinator on Qwen3.8-Flash-Next (qwen3.8-flash-next, 245k, vision). Your job is to PLAN, DELEGATE, INTEGRATE and VERIFY - not to implement yourself.\n\nDELEGATE BY DEFAULT: route code edits and implementation to `coder-local`. You settle the design and own integration and verification; it writes the code.\n\nStay local: use `coder-local`, `agentic-local`, and `vision-local`."
        },
        "explorer": {
          "description": "Default recon — codebase scouting, search, 'where/how is X', read-only (local-pool-chat on Strix).",
          "mode": "subagent",
          "model": "litellm/local-pool-chat"
        },
        "coder-local": {
          "description": "Primary coding lane — Qwen3.8-Flash-Next (local-pool-chat, local, free, vision).",
          "mode": "subagent",
          "model": "litellm/local-pool-chat"
        },
        "agentic-local": {
          "description": "Long-context and agentic lane — Qwen3.8-Flash-Next IQ4_NL on Strix (245k, vision).",
          "mode": "subagent",
          "model": "litellm/qwen3.8-flash-next"
        },
        "implementer": {
          "description": "Implementation lane — implementation-pool (Qwen3.8-Flash-Next -> Free Pool).",
          "mode": "subagent",
          "model": "litellm/implementation-pool"
        },
        "oracle": {
          "description": "Hard debugging / architecture — reasoning-pool (Qwen3.8-Flash-Next -> Free Pool).",
          "mode": "subagent",
          "model": "litellm/reasoning-pool"
        },
        "reviewer": {
          "description": "Independent adversarial review — Qwen3.8-Flash-Next on Strix.",
          "mode": "subagent",
          "model": "litellm/qwen3.8-flash-next",
          "prompt": "You are an ADVERSARIAL reviewer. Assume the change is WRONG and that your job is to prove it. The author already believes it works, so agreement adds nothing - only a found defect has value.\n\nDo NOT summarise the change. Do NOT list what is good. Do NOT praise.\n\nFor every changed execution or ownership boundary, trace: inherited authority and configuration; process and resource lifetime; normal AND abnormal termination paths; and cleanup ownership. Construct a concrete failure scenario for each changed boundary BEFORE deciding it is safe - you may not conclude 'this is fine' without having tried to break it.\n\nAlso hunt: boundary and off-by-one conditions; empty, null, missing and malformed input; error paths that swallow or mask failures; ordering, concurrency and partial-failure states; and any place behaviour diverges from what callers or the surrounding code already assume. Read what the code DOES, not what its names and comments claim.\n\nEvery finding needs three things: file and line, the concrete input or state that triggers it, and the wrong result that follows. A finding you cannot make concrete is a guess - label it or drop it. Use the repository and tools; do not speculate where you can check.\n\nIf you genuinely find nothing, reply 'no defect found' and name the two or three boundaries you attacked hardest and the specific reason each holds. That is the only acceptable clean review."
        }
      },
      "provider": {
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "LiteLLM OpenAI",
          "options": {
            "baseURL": "http://litellm.ai:4000/v1",
            "apiKey": "{env:LITELLM_API_KEY}",
            "timeout": 1800000
          },
          "models": {
            "auto": { "name": "Auto (router)", "limit": { "context": 200000, "output": 16384 } },
            "local-pool": { "name": "Local Pool — Qwen3.8-Flash-Next (Strix ROCm, vision + tools)", "limit": { "context": 200000, "output": 24576 } },
            "local-pool-chat": { "name": "Local Pool Chat — Qwen3.8-Flash-Next non-thinking (Strix)", "limit": { "context": 200000, "output": 16384 } },
            "self-hosted": { "name": "Self-Hosted Alias (local-pool-chat)", "limit": { "context": 200000, "output": 16384 } },
            "qwen3.8-flash-next": { "name": "Qwen3.8-Flash-Next IQ4_NL (Strix ROCm, vision)", "limit": { "context": 200000, "output": 16384 } },
            "implementation-pool": { "name": "Implementation Pool", "limit": { "context": 200000, "output": 16384 } },
            "reasoning-pool": { "name": "Reasoning Pool", "limit": { "context": 200000, "output": 16384 } },
            "frontier-pool": { "name": "Frontier Pool", "limit": { "context": 200000, "output": 16384 } },
            "free-pool": { "name": "Free Pool (Gemini 2.5 Flash / OpenRouter Free)", "limit": { "context": 180000, "output": 16384 } }
          }
        },
        "litellm-anthropic": {
          "npm": "@ai-sdk/anthropic",
          "name": "LiteLLM Anthropic",
          "options": {
            "baseURL": "http://litellm.ai:4000/v1",
            "authToken": "{env:LITELLM_API_KEY}",
            "timeout": 1800000
          },
          "models": {
            "auto": { "name": "Auto (router)", "limit": { "context": 200000, "output": 16384 } },
            "local-pool": { "name": "Local Pool (Strix Qwen3.8-Flash-Next)", "limit": { "context": 200000, "output": 24576 } },
            "local-pool-chat": { "name": "Local Pool Chat (Strix Qwen3.8-Flash-Next non-thinking)", "limit": { "context": 200000, "output": 16384 } }
          }
        }
      },
      "mcp": {
        "toolhive": {
          "type": "remote",
          "url": "http://vmcp-mcp-gateway-internal.ai:4483/mcp",
          "enabled": true
        },
        "context7": {
          "type": "remote",
          "url": "https://mcp.context7.com/mcp",
          "enabled": true,
          "headers": {
            "CONTEXT7_API_KEY": "{env:CONTEXT7_API_KEY}"
          }
        }
      }
    }
