---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencode
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      opencode:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/chaijunkin/opencode
              tag: 2.0.26
            command: ["/etc/opencode/entrypoint.sh"]
            env:
              HOME: &homepath /home/opencode
              OPENCODE_CONFIG: /etc/opencode/opencode.json
              TZ: America/Edmonton
              OTEL_SERVICE_NAME: opencode
              OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy-receiver.observability.svc.cluster.local:4318
              OTEL_EXPORTER_OTLP_INSECURE: "true"
            envFrom:
              - secretRef:
                  name: opencode
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 4096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
    service:
      app:
        controller: opencode
        forceRename: opencode-svc
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["opencode.cloudjur.com"]
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      home:
        existingClaim: *app
        globalMounts:
          - path: *homepath
      config:
        type: configMap
        name: opencode-config
        defaultMode: 0755
        globalMounts:
          - path: /etc/opencode
      default-vault:
        type: nfs
        server: smb.cloudjur.com
        path: /tank/Apps/Obsidian/DefaultVault
        globalMounts:
          - path: /mnt/defaultvault
      developer:
        type: nfs
        server: smb.cloudjur.com
        path: /tank/Developer
        globalMounts:
          - path: /mnt/developer
      ssh:
        type: secret
        name: opencode-ssh
        defaultMode: 0o400
        globalMounts:
          - path: /home/opencode/.ssh/id_ed25519
            subPath: id_ed25519
          - path: /home/opencode/.ssh/id_ed25519.pub
            subPath: id_ed25519.pub
