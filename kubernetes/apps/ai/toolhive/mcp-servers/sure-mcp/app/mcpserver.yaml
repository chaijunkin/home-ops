# yaml-language-server: $schema=https://crd.cloudjur.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: sure-mcp
spec:
  image: node:24-alpine
  transport: stdio
  groupRef:
    name: mcp-tools
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            readOnlyRootFilesystem: false
          env:
            - name: MCP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sure-mcp-secret
                  key: MCP_API_TOKEN
          command:
            - node
          args:
            - -e
            - |
              const https = require('https');
              const readline = require('readline');
              const rl = readline.createInterface({ input: process.stdin, terminal: false });
              rl.on('line', (line) => {
                if (!line.trim()) return;
                const req = https.request({
                  hostname: 'money.cloudjur.com',
                  port: 443,
                  path: '/mcp',
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${process.env.MCP_API_TOKEN}`,
                    'Content-Length': Buffer.byteLength(line)
                  }
                }, (res) => {
                  let data = '';
                  res.on('data', c => data += c);
                  res.on('end', () => console.log(data));
                });
                req.on('error', console.error);
                req.write(line);
                req.end();
              });
