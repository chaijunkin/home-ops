# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: freshrss
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      freshrss:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          init-permissions:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command: ["/bin/sh", "-c", "chown -R 1000:1000 /var/www/FreshRSS/data /var/www/FreshRSS/extensions && chmod -R 777 /var/www/FreshRSS/data /var/www/FreshRSS/extensions"]
            securityContext:
              runAsUser: 0
              runAsNonRoot: false

        containers:
          app:
            image:
              repository: freshrss/freshrss
              tag: 1.29.1-alpine
            env:
              CRON_MIN: "*"
              DOMAIN: freshrss.cloudjur.com
              LISTEN: &port 8080
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 12m
                memory: 128M
              limits:
                memory: 512M

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      data:
        existingClaim: freshrss
        advancedMounts:
          freshrss:
            init-permissions:
              - path: /var/www/FreshRSS/data
                subPath: data
              - path: /var/www/FreshRSS/extensions
                subPath: extensions
            app:
              - path: /var/www/FreshRSS/data
                subPath: data
                readOnly: false
              - path: /var/www/FreshRSS/extensions
                subPath: extensions
                readOnly: false

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Utility Service
          gethomepage.dev/name: FreshRSS
          gethomepage.dev/description: Self-hosted RSS feed aggregator
          gethomepage.dev/icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/freshrss.png
        hostnames:
          - freshrss.cloudjur.com
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
