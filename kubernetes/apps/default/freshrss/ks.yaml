# yaml-language-server: $schema=https://crd.cloudjur.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname freshrss
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  interval: 30m

  path: ./kubernetes/apps/default/freshrss/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  components:
    # - ../../../../components/volsync
    - ../../../../components/kopiur/backup
    - ../../../../components/kopiur/remote
      # - ../../../../components/kopiur/adhoc-snapshot
  postBuild:
    substitute:
      APP: *appname
      KOPIUR_CAPACITY: 2Gi
      # data/users/admin is 0770 apache-owned (100:82) and holds db.sqlite
      # (subscriptions + read state), so it cannot be ignored. Its group (82)
      # has rwx, so joining that group as a supplemental group gives the mover
      # read access without elevating it.
      #
      # Running the mover as root does NOT work: kopiur always applies
      # capabilities.drop:[ALL], so root has no CAP_DAC_OVERRIDE and still gets
      # PermissionDenied on that directory (verified in-cluster: CapEff=0 cannot
      # read it, uid 1000 + supplementalGroups:[82 reads all 28 files).
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
      KOPIUR_NONROOT: "true"
      KOPIUR_SUPPLEMENTAL_GROUPS: "[82]"
  dependsOn:
    - name: openebs
      namespace: storage
