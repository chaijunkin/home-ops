# yaml-language-server: $schema=https://crd.cloudjur.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname freshrss
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  interval: 30m

  path: ./kubernetes/apps/default/freshrss/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  components:
    # - ../../../../components/volsync
    - ../../../../components/kopiur/backup
    - ../../../../components/kopiur/remote
      # - ../../../../components/kopiur/adhoc-snapshot
  postBuild:
    substitute:
      APP: *appname
      KOPIUR_CAPACITY: 2Gi
      # data/users/admin is 0770 apache-owned and holds db.sqlite (subscriptions +
      # read state), so it cannot be ignored; the unprivileged mover (uid 1000)
      # gets PermissionDenied, which fails the whole snapshot. Run the mover as
      # root like ai/open-webui and docs/ai-context/kopiur-troubleshooting.md
      # "Solution 1", but keep PGID/fsGroup at 1000: setting it to 0 would make
      # kubelet chgrp -R the PVC and ping-pong ownership with the app pod.
      KOPIUR_PUID: "0"
      KOPIUR_PGID: "1000"
      KOPIUR_NONROOT: "false"
  dependsOn:
    - name: openebs
      namespace: storage
