# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ignis
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      ignis:
        containers:
          app:
            image:
              repository: docker.io/nobbe/ignis
              tag: 0.8.10@sha256:e2f62cc8ab8b9e526e93f6a263181cd0f00ff47399f9330c3193c959a077e149
            env:
              PUID: "1000"
              PGID: "1000"
              OBSIDIAN_VAULT_PATH: /vaults/defaultvault
              TZ: Asia/Kuala_Lumpur
            ports:
              - containerPort: &port 8080
                name: http
                protocol: TCP
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: ignis
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - notes.cloudjur.com
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Application Service
          gethomepage.dev/name: Ignis (Obsidian)
          gethomepage.dev/icon: obsidian.png
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      obsidian-app:
        type: emptyDir
        globalMounts:
          - path: /app/obsidian-app
      default-vault:
        existingClaim: default-vault-smb-pvc
        globalMounts:
          - path: /vaults/defaultvault
