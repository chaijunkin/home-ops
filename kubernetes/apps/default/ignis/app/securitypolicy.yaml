# yaml-language-server: $schema=https://crd.cloudjur.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Authentik gate for the browser-Obsidian editor (notes.cloudjur.com).
# The vault served here is READ-WRITE over NFS, so this gate protects the whole
# vault, not just a snapshot. Prerequisite (manual, authentik admin UI — the
# authentik-operator is not deployed, same as for the prometheus-ext family in
# observability/external-access): create Application "Ignis" with a Proxy
# Provider whose External URL is https://notes.cloudjur.com.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ignis
spec:
  extAuth:
    failOpen: false
    headersToExtAuth:
      - X-Forwarded-Proto
      - cookie
    http:
      backendRefs:
        - name: authentik-server
          namespace: security
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - Set-Cookie
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
        - authorization
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ignis
