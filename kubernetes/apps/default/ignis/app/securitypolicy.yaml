# yaml-language-server: $schema=https://crd.cloudjur.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# DETACHED (private-first staging): Ignis serves LAN-only via envoy-internal,
# no SSO. Re-attach in kustomization.yaml once the authentik proxy app is
# live — codified as slug "notes" in
# infrastructure/terraform/authentik/applications.tf (stack re-enable:
# kubernetes/apps/security/authentik/terraforms/kustomization.yaml).
# The vault served here is READ-WRITE over NFS, so this gate protects the
# whole vault, not just a snapshot.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ignis
spec:
  extAuth:
    failOpen: false
    headersToExtAuth:
      - X-Forwarded-Proto
      - cookie
    http:
      backendRefs:
        - name: authentik-server
          namespace: security
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - Set-Cookie
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
        - authorization
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ignis
