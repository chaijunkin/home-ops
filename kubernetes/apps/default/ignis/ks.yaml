# yaml-language-server: $schema=https://crd.cloudjur.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ignis
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
    # - ../../../../components/kopiur/remote
  interval: 1h
  path: ./kubernetes/apps/default/ignis/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  postBuild:
    substitute:
      APP: *app
      SUBDOMAIN: ignis
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
      KOPIUR_NONROOT: "true"
  wait: false
  dependsOn:
    - name: openebs
      namespace: storage
    - name: default-vault-smb
      namespace: default
