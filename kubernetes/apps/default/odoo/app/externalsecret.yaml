# yaml-language-server: $schema=https://crd.cloudjur.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo-secret
spec:
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        INIT_POSTGRES_DBNAME: odoo
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .USER }}"
        INIT_POSTGRES_PASS: "{{ .PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        HOST: &dbHost postgres-rw.database.svc.cluster.local
        PORT: "5432"
        USER: &dbUser "{{ .USER }}"
        PASSWORD: &dbPass "{{ .PASSWORD }}"
  refreshInterval: 12h
  data:
    - secretKey: POSTGRES_SUPER_PASS
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 2e579895-287a-4b26-976b-2677620dc376
        property: password
    - secretKey: USER
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: pg_user
        property: e8830296-eba7-4924-9fba-937d93e7a31d
    - secretKey: PASSWORD
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: pg_password
        property: e8830296-eba7-4924-9fba-937d93e7a31d