# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app odoo

spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h

  maxHistory: 5
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 5

  values:
    controllers:
      odoo:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18.6"
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: odoo-secret

        containers:
          app:
            image:
              repository: docker.io/odoo
              tag: 19.0-20251222

            env:
              TZ: Asia/Kuala_Lumpur
              PROXY_MODE: "True"

            args: [odoo, -i, base, -d, odoo]

            envFrom:
              - secretRef:
                  name: odoo-secret

            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 4Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: [ALL]}
          code:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.133.0
            env:
              TZ: Asia/Kuala_Lumpur
            args:
              - --user-data-dir
              - /tmp/.vscode
              - --extensions-dir
              - /tmp/.vscode
              - --port
              - "8081"
              - /mnt/extra-addons

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [100, 101]
        seccompProfile: {type: RuntimeDefault}

    service:
      app:
        controller: *app
        ports:
          http:
            port: 8069

    route:
      app:
        hostnames:
          - odoo.cloudjur.com
          - erp.cloudjur.com
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - port: 8069
                name: *app
                # filters:
                #   - type: RequestHeaderModifier
                #     requestHeaderModifier:
                #       add:
                #         - name: "X-Forwarded-Proto"
                #           value: "https"
                #         - name: "X-Forwarded-Host"
                #           value: "odoo.cloudjur.com"
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          odoo:
            app:
              - path: /var/lib/odoo
              - path: /mnt/extra-addons
                subPath: extra-addons
            code:
              - path: /mnt/extra-addons
                subPath: extra-addons
      etc-config-file:
        type: configMap
        name: odoo-configmap
        globalMounts:
          - path: /etc/odoo/odoo.conf
            subPath: odoo.conf
