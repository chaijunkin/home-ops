# yaml-language-server: $schema=https://crd.cloudjur.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app odoo
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/default/odoo/app
  components:
    - ../../../../components/kopiur/backup
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  prune: true
  postBuild:
    substitute:
      APP: *app
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
      VOLSYNC_CAPACITY: 5Gi
