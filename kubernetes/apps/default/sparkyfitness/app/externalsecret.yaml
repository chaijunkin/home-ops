# yaml-language-server: $schema=https://crd.cloudjur.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness-secret
spec:
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        INIT_POSTGRES_DBNAME: sparkyfitness
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .USER }}"
        INIT_POSTGRES_PASS: "{{ .PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        host: postgres-rw.database.svc.cluster.local
        port: "5432"
        dbname: sparkyfitness
        username: "{{ .USER }}"
        password: "{{ .PASSWORD }}"
        uri: "postgresql://{{ .USER }}:{{ .PASSWORD }}@postgres-rw.database.svc.cluster.local:5432/sparkyfitness"
        SPARKY_FITNESS_API_ENCRYPTION_KEY: "{{ .SPARKY_FITNESS_API_ENCRYPTION_KEY }}"
        BETTER_AUTH_SECRET: "{{ .BETTER_AUTH_SECRET }}"
        SPARKY_FITNESS_OIDC_CLIENT_SECRET: "{{ .SPARKY_FITNESS_OIDC_CLIENT_SECRET }}"
  refreshInterval: 12h
  data:
    - secretKey: POSTGRES_SUPER_USER
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 2e579895-287a-4b26-976b-2677620dc376
        property: username
    - secretKey: POSTGRES_SUPER_PASS
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 2e579895-287a-4b26-976b-2677620dc376
        property: password
    - secretKey: USER
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 0f0ab97a-8e58-4c98-b6f2-00bdd1e62f93
        property: pg_user
    - secretKey: PASSWORD
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 0f0ab97a-8e58-4c98-b6f2-00bdd1e62f93
        property: pg_password
    - secretKey: SPARKY_FITNESS_API_ENCRYPTION_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 0f0ab97a-8e58-4c98-b6f2-00bdd1e62f93
        property: api_encryption_key
    - secretKey: BETTER_AUTH_SECRET
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 0f0ab97a-8e58-4c98-b6f2-00bdd1e62f93
        property: better_auth_secret
    - secretKey: SPARKY_FITNESS_OIDC_CLIENT_SECRET
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 0f0ab97a-8e58-4c98-b6f2-00bdd1e62f93
        property: oidc_client_secret
