# yaml-language-server: $schema=https://crd.cloudjur.com/external-secrets.io/externalsecret_v1.json
# Two roles per upstream (kritika.home-operations.com/database/): owner runs migrations, app
# serves runtime. Passwords live in Bitwarden login items (operator decision 2026-11-04: no
# runtime generators — credentials must outlive the cluster state that stores them, same pattern
# as the shared cluster's cloudnative-pg-secret -> 2e579895-…). Charset guidance for the items:
# alphanumeric passwords only, so the templated URI below never needs escaping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-owner
spec:
  target:
    deletionPolicy: Delete
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  refreshInterval: 12h
  data:
    - secretKey: username
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: OWNER_ITEM_UUID
        property: username
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: OWNER_ITEM_UUID
        property: password
---
# yaml-language-server: $schema=https://crd.cloudjur.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-app
spec:
  target:
    deletionPolicy: Delete
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        # Kritika reads a `uri` key (upstream chart contract). DIRECT service, never a Pooler:
        # transaction pooling breaks the session advisory lock, LISTEN, and publication locks.
        # connect_timeout is required upstream — a DNS-cached dead Service address otherwise
        # hangs a first dial for minutes.
        uri: postgres://{{ .username }}:{{ .password }}@kritika-postgres-rw.dev.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  refreshInterval: 12h
  data:
    - secretKey: username
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: APP_ITEM_UUID
        property: username
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: APP_ITEM_UUID
        property: password
