# yaml-language-server: $schema=https://crd.cloudjur.com/external-secrets.io/externalsecret_v1.json
# Generated, URI-safe passwords for the two Kritika roles (upstream database.md: a password
# generator feeding templated ExternalSecrets is the recommended shape). Charset chosen so the
# generated value embeds in the connection URI without escaping.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: kritika-postgres-owner-password
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 32
      digits: 8
      symbols: 4
      symbolCharacters: "-_."
      allowRepeat: false
      noUpper: false
---
# yaml-language-server: $schema=https://crd.cloudjur.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-owner
spec:
  target:
    deletionPolicy: Delete
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika
        password: "{{ .password }}"
  refreshInterval: Never
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: kritika-postgres-owner-password
---
# yaml-language-server: $schema=https://crd.cloudjur.com/external-secrets.io/externalsecret_v1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: kritika-postgres-app-password
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 32
      digits: 8
      symbols: 4
      symbolCharacters: "-_."
      allowRepeat: false
      noUpper: false
---
# yaml-language-server: $schema=https://crd.cloudjur.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-app
spec:
  target:
    deletionPolicy: Delete
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_app
        password: "{{ .password }}"
        # Kritika reads a `uri` key (upstream chart contract). DIRECT service, never a Pooler:
        # transaction pooling breaks the session advisory lock, LISTEN, and publication locks.
        # connect_timeout is required upstream — a DNS-cached dead Service address otherwise
        # hangs a first dial for minutes.
        uri: postgres://kritika_app:{{ .password }}@kritika-postgres-rw.dev.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  refreshInterval: Never
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: kritika-postgres-app-password
