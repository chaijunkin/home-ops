# yaml-language-server: $schema=https://crd.cloudjur.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kritika-postgres
  namespace: &namespace dev
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: kritika-postgres
  dependsOn:
    - name: cloudnative-pg
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/dev/kritika-postgres/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: dev
  wait: true
  timeout: 10m
---
# yaml-language-server: $schema=https://crd.cloudjur.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kritika-postgres-backup
  namespace: &namespace dev
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: kritika-postgres-backup
  dependsOn:
    - name: kritika-postgres
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/dev/kritika-postgres/backup
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: dev
  wait: false
