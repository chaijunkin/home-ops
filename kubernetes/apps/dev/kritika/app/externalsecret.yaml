# yaml-language-server: $schema=https://crd.cloudjur.com/external-secrets.io/externalsecret_v1.json
# Kritika's credentials, all from Bitwarden items the fleet already uses — no new secrets except
# two custom fields on the Kritika hub item (operator decision 2026-11-04: ExternalSecrets only,
# no runtime-generated passwords).
#   6472239d-…  Kritika hub: the two DB roles (see ../database/externalsecret.yaml) plus
#               admin_password + github_webhook_secret as text custom fields.
#   fd77a223-…  cjk-bot (single-bot fleet, spec 003 FR-007): `github_app_id` custom field, and the
#               App's private key as the item's NOTE (same read as renovate's cjk-bot-pem and
#               konflate, both of which already sign GitHub App JWTs with it).
#   bf2fcc14-…  LiteLLM: `LITELLM_VIRTUAL_KEY`, the same key open-webui, hermes, memini and
#               opencode use (operator decision 2026-11-05). Spend is attributed to that key, not
#               the proxy master key.
# clientId is the App's numeric ID: Kritika signs the App JWT with it as `iss`
# (internal/forge/github/app.go appJWT), exactly as konflate does with this same field
# (internal/provider/writer.go appJWT, KONFLATE_APP_CLIENT_ID <- github_app_id). Upstream docs
# show an `Iv1.…` string in that key, which is the OAuth client id; the JWT issuer GitHub accepts
# is the App ID, so this uses the field that is already proven live in this cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika
spec:
  target:
    name: kritika-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        KRITIKA_AUTH_ADMIN_PASSWORD: "{{ .admin_password }}"
        KRITIKA_GITHUB_WEBHOOK_SECRET: "{{ .github_webhook_secret }}"
        KRITIKA_GITHUB_CLIENT_ID: "{{ .github_app_id }}"
        KRITIKA_GITHUB_PRIVATE_KEY: "{{ .github_app_private_key }}"
        KRITIKA_LITELLM_API_KEY: "{{ .LITELLM_VIRTUAL_KEY }}"
  refreshInterval: 12h
  data:
    - secretKey: admin_password
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 5f02f2d0-8239-4cf5-b8b2-67b7ad9868c1
        property: admin_password
    - secretKey: github_webhook_secret
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 5f02f2d0-8239-4cf5-b8b2-67b7ad9868c1
        property: github_webhook_secret
    - secretKey: github_app_id
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: fd77a223-2367-4076-a71e-b34bef8c9268
        property: github_app_id
    - secretKey: github_app_private_key
      sourceRef:
        storeRef:
          name: bitwarden-notes
          kind: ClusterSecretStore
      remoteRef:
        key: fd77a223-2367-4076-a71e-b34bef8c9268
    - secretKey: LITELLM_VIRTUAL_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: bf2fcc14-bd51-4122-9445-53dacdfb1d69
        property: LITELLM_VIRTUAL_KEY
