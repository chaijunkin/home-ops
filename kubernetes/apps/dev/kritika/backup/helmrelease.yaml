# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Manual backup pipeline, mirroring database/cloudnative-pg/backup (user decision 2026-11-04:
# pg_dump -> NFS like the shared postgres, NOT barman/CNPG-native). Host-named subdirectories in
# the export keep this job's files separate from the shared cluster's (kritika-postgres-rw vs
# postgres-rw), so the same NFS path is safe to reuse.
# Credentials: the owner role (kritika) dumps its own database; keys come straight from the
# owner Secret that the sibling ExternalSecret generates — nothing new to store.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kritika-postgres-backup
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      kritika-postgres-backup:
        type: cronjob
        cronjob:
          schedule: "@daily" # [BACKUP_SCHEDULE]
          ttlSecondsAfterFinished: 43200
        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
          enableServiceLinks: false
        containers:
          app:
            image:
              repository: docker.io/prodrigestivill/postgres-backup-local
              tag: 18@sha256:f70742ebe42b2277689b028d1fd15aa80f77cffa01da163cc9f85a6ff1866e7f
            command: [/backup.sh]
            env:
              BACKUP_DIR: /backups
              BACKUP_KEEP_DAYS: "7"
              BACKUP_KEEP_MINS: "7200"
              BACKUP_KEEP_MONTHS: "6"
              BACKUP_KEEP_WEEKS: "4"
              BACKUP_LATEST_TYPE: symlink
              POSTGRES_EXTRA_OPTS: -b -C -c -Z6
              POSTGRES_HOST: kritika-postgres-rw.dev.svc.cluster.local
              POSTGRES_DB: kritika
              SCHEDULE: "@daily"
              TZ: Asia/Kuala_Lumpur
              # Explicit mapping: the owner Secret is kubernetes.io/basic-auth (keys
              # username/password), the tool wants POSTGRES_USER/POSTGRES_PASSWORD.
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: kritika-postgres-owner
                    key: username
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: kritika-postgres-owner
                    key: password
    persistence:
      backups:
        type: nfs
        server: smb.cloudjur.com
        path: /tank/Backup/Database
