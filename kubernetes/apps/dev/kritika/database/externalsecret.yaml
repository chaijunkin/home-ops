# yaml-language-server: $schema=https://crd.cloudjur.com/external-secrets.io/externalsecret_v1.json
# Two roles per upstream (kritika.home-operations.com/database/), from ONE Bitwarden login item
# 5f02f2d0-8239-4cf5-b8b2-67b7ad9868c1 (operator decision 2026-11-04: no runtime generators — the
# owner password is baked into the DB at initdb, so the credential must outlive the cluster state
# that stores it). Same item-as-hub pattern as the shared cluster's 2e579895-….
#   owner kritika      -> the item's login username + password  (bitwarden-login)
#   app kritika_app    -> custom fields `app_username` + `app_password`  (bitwarden-fields)
# CNPG requires each secret's `username` to match the role it configures, and Kritika REFUSES one
# role doing both jobs: the app role may not own tables, be superuser, or hold BYPASSRLS
# (internal/store/store.go assertApplicationRole). Item passwords stay alphanumeric so the
# templated URI below never needs escaping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-owner
spec:
  target:
    deletionPolicy: Delete
    template:
      metadata:
        labels:
          # Makes CNPG reconcile the cluster when the credential rotates (bjw-s idiom).
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        # The chart's database.owner.key is `uri` too (charts/kritika/values.yaml: database.owner
        # .key: uri) — the leader runs migrations with it. Omitting it here made the owner Secret
        # unusable by the app even though CNPG was happy with it (it reads username/password only).
        # Same direct -rw endpoint and connect_timeout as the app role; never a Pooler.
        uri: postgres://{{ .username }}:{{ .password }}@kritika-postgres-rw.dev.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  refreshInterval: 12h
  data:
    - secretKey: username
      sourceRef:
        storeRef:
          name: bitwarden-field
          kind: ClusterSecretStore
      remoteRef:
        key: 5f02f2d0-8239-4cf5-b8b2-67b7ad9868c1
        property: db_username
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-field
          kind: ClusterSecretStore
      remoteRef:
        key: 5f02f2d0-8239-4cf5-b8b2-67b7ad9868c1
        property: db_password
---
# yaml-language-server: $schema=https://crd.cloudjur.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # NOT `kritika-postgres-app`. CloudNativePG reserves `<cluster>-app` for the Secret it manages
  # itself (proved on this cluster: `postgres` owns CNPG's `postgres-app`, labels cnpg.io/userType:
  # app, ownerRef kind Cluster). Two controllers on one Secret means ESO fails to adopt it, or wins
  # and CNPG reverts the credentials. bjw-s/home-ops hit this and renamed the same way.
  name: kritika-postgres-approle
spec:
  target:
    deletionPolicy: Delete
    template:
      metadata:
        labels:
          # Makes CNPG reconcile the cluster when the credential rotates (bjw-s idiom).
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: kritika_app
        password: "{{ .password }}"
        # Kritika reads a `uri` key (upstream chart contract). DIRECT service, never a Pooler:
        # transaction pooling breaks the session advisory lock, LISTEN, and publication locks.
        # connect_timeout is required upstream — a DNS-cached dead Service address otherwise
        # hangs a first dial for minutes.
        uri: postgres://kritika_app:{{ .password }}@kritika-postgres-rw.dev.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  refreshInterval: 12h
  data:
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 5f02f2d0-8239-4cf5-b8b2-67b7ad9868c1
        property: app_password
