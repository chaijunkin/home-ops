# yaml-language-server: $schema=https://crd.cloudjur.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The Kritika database, before the app: the Cluster has to be Ready (and the extensions
# installed by the Database resource) before kritika serve will start at all — it refuses
# to boot without both vector and vchord. Shape follows bjw-s and onedr0p/home-ops, both of
# which run Kritika this way. The app registers as its own `kritika` Kustomization in a
# later PR, with dependsOn on this one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kritika-database
  namespace: &namespace dev
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: kritika-database
  dependsOn:
    # The operator must be up before its Cluster is submitted.
    - name: cloudnative-pg
      namespace: database
  # Flux otherwise reports success as soon as the objects are applied; a Cluster that never
  # becomes Ready would otherwise only surface when the app fails to start. Condition type
  # `Ready` verified against this cluster's live CNPG 1.30.0 (postgres: Initialized, Ready, …).
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/dev/kritika/database
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: *namespace
  timeout: 15m
  wait: true
---
# yaml-language-server: $schema=https://crd.cloudjur.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kritika-postgres-backup
  namespace: &namespace dev
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: kritika-postgres-backup
  dependsOn:
    - name: kritika-database
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/dev/kritika/backup
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: *namespace
  wait: false
