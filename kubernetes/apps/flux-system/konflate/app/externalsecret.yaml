# yaml-language-server: $schema=https://crd.cloudjur.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate-secret
spec:
  target:
    name: konflate-secret
    template:
      data:
        KONFLATE_WEBHOOK_SECRET: "{{ .konflate_webhook_secret }}"
        KONFLATE_APP_CLIENT_ID: "{{ .bot_app_id }}"
        KONFLATE_APP_PRIVATE_KEY: "{{ .bot_app_private_key }}"
  data:
    # TODO: Replace <BITWARDEN_ITEM_UUID> with the UUID of the Bitwarden item
    # that holds your GitHub App credentials (BOT_APP_ID / BOT_APP_PRIVATE_KEY).
    # These are the same creds used in .github/workflows/flux-local.yaml.
    - secretKey: bot_app_id
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: fd77a223-2367-4076-a71e-b34bef8c9268
        property: github_app_id
    - secretKey: bot_app_private_key
      sourceRef:
        storeRef:
          name: bitwarden-notes
          kind: ClusterSecretStore
      remoteRef:
        key: fd77a223-2367-4076-a71e-b34bef8c9268
    # TODO: Create a new Bitwarden item (or field) with a randomly generated
    # webhook secret string, then replace <NEW_BITWARDEN_ITEM_UUID> below.
    - secretKey: konflate_webhook_secret
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: fd77a223-2367-4076-a71e-b34bef8c9268
        property: konflate_secret
