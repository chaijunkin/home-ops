# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
spec:
  interval: 24h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          disable-problematic-plugins:
            image:
              repository: alpine
              tag: 3.24
            command: ["/bin/sh", "-c"]
            args:
              - |
                mkdir -p /config/plugins_disabled
                for p in /config/plugins/Intro\ Skipper*; do
                  if [ -e "$p" ]; then
                    echo "Moving hanging plugin $p to /config/plugins_disabled/"
                    mv "$p" /config/plugins_disabled/
                  fi
                done
        containers:
          app:
            image:
              repository: jellyfin/jellyfin
              tag: 10.11.11
              pullPolicy: IfNotPresent
            env:
              TZ: Asia/Kuala_Lumpur
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              JELLYFIN_FFmpeg__probesize: 50000000
              JELLYFIN_FFmpeg__analyzeduration: 50000000
              JELLYFIN_PublishedServerUrl: https://{{ .Release.Name
                }}.cloudjur.com

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /System/Ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /System/Ping
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
            resources:
              requests:
                memory: 1Gi
                cpu: 10m
              limits:
                memory: 4Gi
        pod:
          # nodeSelector:
          #   intel.feature.node.kubernetes.io/gpu: "true"
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            # fsGroupChangePolicy: OnRootMismatch
            # supplementalGroups: [44, 10000]
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.10.30.17
        ports:
          http:
            port: *port
    persistence:
      config:
        existingClaim: *app
      tmps:
        type: emptyDir
        advancedMounts:
          jellyfin:
            app:
              - path: /cache
                subPath: cache
              - path: /config/log
                subPath: log
              - path: /tmp
                subPath: tmp
      config-cache:
        existingClaim: jellyfin-cache
        globalMounts:
          - path: /config/metadata
            subPath: metadata
          - path: /config/transcode
            subPath: transcode
          - path: /config/cache
            subPath: cache
      media:
        enabled: true
        type: nfs
        server: smb.cloudjur.com
        path: /tank/Storage
        globalMounts:
          - path: /media
    route:
      app:
        hostnames:
          - jellyfin.cloudjur.com
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - port: *port
                name: *app
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media Service
          gethomepage.dev/name: jellyfin
          gethomepage.dev/icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/jellyfin.png
          gethomepage.dev/description: Media Player
          # gethomepage.dev/widget.type: jellyfin
          # gethomepage.dev/widget.url: http://jellyfin.media:8096
          # gethomepage.dev/widget.username: "{{ `{{HOMEPAGE_VAR_JELLYFIN_USERNAME`}} }}"
          # gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_JELLYFIN_PASSWORD`}} }}"
