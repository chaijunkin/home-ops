# yaml-language-server: $schema=https://crd.cloudjur.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: neko
  namespace: media
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: neko
  path: ./kubernetes/apps/media/neko/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 24h
  retryInterval: 1m

  postBuild:
    substitute:
      APP: neko
      KOPIUR_CLAIM: neko-firefox-profile
      SUBDOMAIN: movienight
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/kopiur/remote
      # - ../../../../components/kopiur/adhoc-snapshot
  dependsOn:
    - name: openebs
      namespace: storage
