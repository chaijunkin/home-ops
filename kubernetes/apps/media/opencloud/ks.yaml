# yaml-language-server: $schema=https://crd.cloudjur.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app opencloud
  namespace: media
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
    # - ../../../../components/volsync-no-r2
    # - ../../../../components/kopiur/adhoc-snapshot
  dependsOn:
    - name: openebs
      namespace: storage
  interval: 30m
  path: ./kubernetes/apps/media/opencloud/app
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CLAIM: opencloud-data
      KOPIUR_CLAIM: opencloud-data
      KOPIUR_PUID: "0"
      KOPIUR_PGID: "0"
      KOPIUR_NONROOT: "false"
      VOLSYNC_CAPACITY: 100Gi
      SUBDOMAIN: drive
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  retryInterval: 1m
