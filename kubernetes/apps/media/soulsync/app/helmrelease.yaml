# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app soulsync
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      soulsync:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: nezreka/soulsync
              tag: 3.3.2@sha256:7e847bec847f6ba8098dc823b80370b937c72f1c817cc85e3a7e71a92fa64e36
            env:
              FLASK_ENV: production
              PGID: 1000
              PUID: 1000
              PYTHONPATH: /app
              SOULSYNC_CONFIG_PATH: /app/config/config.json
              TZ: Asia/Kuala_Lumpur
              UMASK: "022"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8008
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1024Mi
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          soulsync:
            app:
              - path: /app/config
                subPath: config
              - path: /app/data
                subPath: data
              - path: /app/logs
                subPath: logs
      media:
        type: nfs
        server: smb.cloudjur.com
        path: /tank/Storage
        advancedMounts:
          soulsync:
            app:
              - path: /media
              - path: /app/downloads
                subPath: Downloads/slskd/complete
              - path: /app/Transfer
                subPath: Music
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        hostnames:
          - soulsync.cloudjur.com
        rules:
          - backendRefs:
              - name: *app
                port: *port
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media Service
          gethomepage.dev/name: SoulSync
          gethomepage.dev/icon: mdi-music-box-multiple
          gethomepage.dev/description: Music Discovery & Automation
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
