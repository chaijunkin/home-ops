# yaml-language-server: $schema=https://crd.cloudjur.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter-vpn
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter-vpn
  interval: 1h
  values:
    fullnameOverride: blackbox-exporter-vpn
    strategy:
      type: Recreate
      rollingUpdate:
    podAnnotations:
      k8s.v1.cni.cncf.io/networks: |-
        [{
          "name": "vpn",
          "namespace": "network",
          "ips": ["10.10.31.20/24"]
        }]
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        - alert: VpnProbeFailed
          expr: |-
            probe_success{service="blackbox-exporter-vpn"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues
        # The 2026-11-21 outage was "tunnel up, no return traffic": handshakes completed every
        # ~60 s and dpinger reached the tunnel end at 13 ms, while Proton forwarded nothing. That
        # reads as VpnProbeFailed with no hint the tunnel itself looked healthy, so the search
        # started at the firewall. Pairing handshake freshness with total probe failure names the
        # provider-side fault directly. max(...) == 0 requires every probe to fail, so one sick
        # endpoint cannot impersonate it; the two probes agreed on all 20 days checked.
        # `and on()` is mandatory: these two metrics share no labels, so a bare `and` silently
        # returns zero series (verified). Scoping to the exit peer is mandatory too: the
        # inbound-only wg1 peers report last_handshake 0 and would match forever.
        - alert: VpnTunnelUpButNoReturn
          expr: |-
            (time() - opnsense_wireguard_peer_last_handshake_seconds{device="wg2", peer_name="ProtonVPN_Singapore"} < 300)
              and on()
            (max(probe_success{service="blackbox-exporter-vpn"}) == 0)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              WireGuard peer {{ $labels.peer_name }} keeps re-keying but every egress probe through
              it is failing, so the provider has the tunnel up and is forwarding nothing. Check
              with the VPN provider before re-testing the firewall or the client config.
