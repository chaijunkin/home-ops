# yaml-language-server: $schema=https://crd.cloudjur.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: speedtest-exporter-rules
spec:
  groups:
    - name: speedtest-exporter.rules
      rules:
        - alert: SpeedtestExporterAbsent
          annotations:
            description:
              Speedtest Exporter has disappeared from Prometheus target
              discovery.
            summary: Speedtest Exporter is down.
          expr: |
            absent(up{job=~".*speedtest-exporter.*"} == 1)
          for: 75m
          labels:
            severity: critical
        - alert: SpeedtestSlowInternetDownload
          annotations:
            description:
              Internet download speed is averaging {{ humanize $value }}
              bit/s.
            summary: SpeedTest slow internet download.
          # Thresholds are in bit/s because the metric is in bit/s (922324560 == 922 Mbps),
          # so 200 Mbps is 200e6. Baseline measured 2026-11-26: 910-922 Mbps down.
          expr: |
            avg_over_time(speedtest_download_bits_per_second{job=~".*speedtest-exporter.*"}[4h])
              < 200e6
          for: 0m
          labels:
            severity: warning
        - alert: SpeedtestSlowInternetUpload
          annotations:
            description:
              Internet upload speed is averaging {{ humanize $value }}
              bit/s.
            summary: SpeedTest slow internet upload.
          # 30 Mbps is 30e6 bit/s. Baseline measured 2026-11-26: 521 Mbps up.
          expr: |
            avg_over_time(speedtest_upload_bits_per_second{job=~".*speedtest-exporter.*"}[4h])
              < 30e6
          for: 0m
          labels:
            severity: warning
        - alert: SpeedtestHighPingLatency
          annotations:
            description:
              Internet ping latency is averaging {{ humanize $value }}
              ms.
            summary: SpeedTest high ping latency.
          expr: |
            avg_over_time(speedtest_ping_latency_milliseconds{job=~".*speedtest-exporter.*"}[4h])
              > 20
          for: 0m
          labels:
            severity: warning
        - alert: SpeedtestHighJitterLatency
          annotations:
            description:
              Internet jitter latency is averaging {{ humanize $value }}
              ms.
            summary: SpeedTest high jitter latency.
          expr: |
            avg_over_time(speedtest_jitter_latency_milliseconds{job=~".*speedtest-exporter.*"}[4h])
              > 30
          for: 0m
          labels:
            severity: warning
