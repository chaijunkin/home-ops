# yaml-language-server: $schema=https://crd.cloudjur.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  labels:
    dashboards: grafana
  name: postgresql-database-observability
spec:
  allowCrossNamespaceImport: true
  folderUID: integration---postgresql
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
    - datasourceName: loki
      inputName: DS_LOKI
  configMapRef:
    name: postgresql-database-observability
    key: database-observability-overview.json
---
