# ---------------------------------------------------------------------------
# Machine ingest — external hosts (e.g. the Strix Halo mini PC, outside the
# cluster) push telemetry INTO the in-cluster stack via the LAN-only internal
# gateway. No extAuth: these are agent->backend ingest endpoints reachable only
# from the trusted internal network (envoy-internal @ 10.10.30.25).
# All routes target the alloy-receiver gateway, which fans out by signal type
# (logs->Loki, metrics->Prometheus, traces->Tempo, profiles->Pyroscope).
# ---------------------------------------------------------------------------
# Logs push: Alloy on the mini PC -> https://logs-ingest.cloudjur.com/loki/api/v1/push
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: logs-ingest
spec:
  hostnames: [logs-ingest.cloudjur.com]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: k8s-monitoring-alloy-receiver
          namespace: observability
          port: 3500
---
# Traces (OTLP): Beyla on the mini PC -> https://traces-ingest.cloudjur.com/v1/traces
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traces-ingest
spec:
  hostnames: [traces-ingest.cloudjur.com]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: k8s-monitoring-alloy-receiver
          namespace: observability
          port: 4318
---
# Profiles (Pyroscope/pprof): eBPF agent on the mini PC -> https://profiles-ingest.cloudjur.com/ingest
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: profiles-ingest
spec:
  hostnames: [profiles-ingest.cloudjur.com]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: k8s-monitoring-alloy-receiver
          namespace: observability
          port: 4040
---
# Metrics (Prometheus remote-write): Alloy on the mini PC -> https://metrics-ingest.cloudjur.com/api/v1/write
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metrics-ingest
spec:
  hostnames: [metrics-ingest.cloudjur.com]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: k8s-monitoring-alloy-receiver
          namespace: observability
          port: 9090
