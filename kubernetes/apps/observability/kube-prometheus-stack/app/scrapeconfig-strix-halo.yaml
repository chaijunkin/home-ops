# yaml-language-server: $schema=https://crd.cloudjur.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: strix-halo
spec:
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: halogen
  staticConfigs:
    - labels:
        namespace: llm
        node: strix-halo
        service: halogen
      targets:
        - 192.168.1.149:8731