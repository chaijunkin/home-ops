# yaml-language-server: $schema=https://crd.cloudjur.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: strix-halo
spec:
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: halogen
  # Halogen (192.168.1.149:8731) removed from pull: now scraped by Alloy on the
  # host and pushed via remote-write through the metrics-ingest gateway.
  # Labels below are preserved so dashboards keep working; Alloy must emit
  # identical labels (job=halogen, namespace=llm, node=strix-halo, service=halogen).
  staticConfigs:
    - labels:
        namespace: llm
        node: strix-halo
        service: halogen
      targets: []