# yaml-language-server: $schema=https://crd.cloudjur.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name node-exporter
spec:
  staticConfigs:
    - targets:
        - gateway.cloudjur.com:9100
        - 10.10.30.10:9100
        # strix-halo (192.168.1.149) removed: now pushed via Alloy remote-write
        # through the prometheus-ingest gateway (k8s-monitoring prometheusMetricsReceiver)
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
