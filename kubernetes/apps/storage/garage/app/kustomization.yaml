# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  # Private-first staging (route on envoy-internal = LAN-only). Re-attach the
  # extAuth gate when the authentik proxy apps are live — entries already
  # codified in infrastructure/terraform/authentik/applications.tf.
  # - ./securitypolicy.yaml
configMapGenerator:
  - name: garage-configmap
    files:
      - garage.toml=./resources/garage.toml
generatorOptions:
  disableNameSuffixHash: true
