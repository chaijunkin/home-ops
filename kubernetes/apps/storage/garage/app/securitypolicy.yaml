# yaml-language-server: $schema=https://crd.cloudjur.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# DETACHED (private-first staging): read.cloudjur.com serves LAN-only via
# envoy-internal, no SSO. Re-attach in kustomization.yaml AND move the
# notes-web route back to envoy-external only together, once the authentik
# proxy app is live — codified as slug "read" in
# infrastructure/terraform/authentik/applications.tf.
# Serves the WHOLE vault including pages without `publish: true`, so this
# extAuth boundary is the security line for any non-internal exposure —
# never downgrade it to the wiki-web Referer-hiding pattern.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: notes-web
spec:
  extAuth:
    failOpen: false
    headersToExtAuth:
      - X-Forwarded-Proto
      - cookie
    http:
      backendRefs:
        - name: authentik-server
          namespace: security
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - Set-Cookie
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
        - authorization
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: garage-notes-web
