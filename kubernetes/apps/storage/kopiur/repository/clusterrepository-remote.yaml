# yaml-language-server: $schema=https://crd.cloudjur.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: remote
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-remote-secret
          namespace: storage
      endpoint: 8550295d25a8172e9fe4f9f7a7f327be.r2.cloudflarestorage.com
      region: auto
      bucket: kopia
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-remote-secret
      namespace: storage
      key: KOPIA_PASSWORD
  create:
    enabled: true # Step 1, then disable this
  concurrency:
    maxConcurrentJobs: 2
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  catalog:
    adoption: Ignore
    periodicRefresh: false
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: Asia/Kuala_Lumpur
    jitter: 45m
  moverDefaults:
    cache:
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 512
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi
    ttlSecondsAfterFinished: 300
