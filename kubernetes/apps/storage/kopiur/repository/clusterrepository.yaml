# yaml-language-server: $schema=https://crd.cloudjur.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          path: /tank/Backup/Kopiur
          server: smb.cloudjur.com
  catalog:
    adoption: Ignore
    periodicRefresh: false
  create:
    enabled: true # Step 1, then disable this
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      key: KOPIA_PASSWORD
      name: kopiur-repository-secret
      namespace: storage
  concurrency:
    maxConcurrentJobs: 2
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: Asia/Kuala_Lumpur
    jitter: 45m
  maintenance:
    enabled: true
    namespace: storage
    schedule:
      full:
        cron: "0 3 * * *"
        jitter: 1h
      quick:
        cron: "0 */6 * * *"
        jitter: 30m
      timezone: Asia/Kuala_Lumpur
    takeoverPolicy: Force
  # mode: ReadWrite
  moverDefaults:
    cache:
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 512
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi
    ttlSecondsAfterFinished: 300
