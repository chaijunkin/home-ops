# yaml-language-server: $schema=https://crd.cloudjur.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          path: /tank/Backup/Kopiur
          server: smb.cloudjur.com
  # catalog:
  #   fallbackNamespace: storage
  #   periodicRefresh: true
  #   refreshInterval: 1h
  # create:
  #   enabled: false
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      key: KOPIA_PASSWORD
      name: kopiur-repository-secret
      namespace: storage
  identityDefaults:
    hostnameExpr: "namespace"
    usernameExpr: "policyName"
  scheduleDefaults:
    timezone: Asia/Kuala_Lumpur
