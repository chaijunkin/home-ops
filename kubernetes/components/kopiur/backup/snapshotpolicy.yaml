# yaml-language-server: $schema=https://crd.cloudjur.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
  annotations:
    kopiur.home-operations.com/allow-identity-change: "true"
spec:
  copyMethod: Direct
  files:
    ignoreRules: ${KOPIUR_IGNORE_RULES:=[]}
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsUser: ${KOPIUR_PUID:=2000}
      runAsGroup: ${KOPIUR_PGID:=2000}
      runAsNonRoot: ${KOPIUR_NONROOT:=true}
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=2000}
      fsGroupChangePolicy: OnRootMismatch
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepLatest: 14
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: ${KOPIUR_CLAIM:-${APP}}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=miroir-snap}
