# yaml-language-server: $schema=https://crd.cloudjur.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ${APP}-remote
spec:
  policyRef:
    name: ${APP}-remote
  schedule:
    cron: 0 2,14 * * *
    # Skip a slot missed by more than 30 minutes (e.g. the node rebooted mid-wave)
    # instead of releasing every backlogged job at once. Measured against the
    # jittered slot, not the cron minute (kopiur snapshot_schedule.rs:missed_deadline).
    startingDeadlineSeconds: 1800
